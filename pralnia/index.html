<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pralnia Zoo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap">
<style>
:root{--sky:#9fe3f5;--panel:#fdfcf7;--ink:#173a5e;--edge:#0f2a47;--duck:#ffd23f;--pink:#ff7eb6;--aqua:#35b6e8;--dim:rgba(15,42,71,.55);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#213f63;--ink:#fdfcf7;--edge:#0a1c30;--dim:rgba(5,14,26,.7)}}
:root[data-theme="dark"]{--panel:#213f63;--ink:#fdfcf7;--edge:#0a1c30;--dim:rgba(5,14,26,.7)}
*{box-sizing:border-box}[hidden]{display:none !important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:"Baloo 2",ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;color:var(--ink);font-weight:800}
#ui button,#start button{pointer-events:auto;font:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;color:var(--ink)}
#ui button:focus-visible,#start button:focus-visible{outline:4px solid var(--duck);outline-offset:3px}
#top{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-right,0px)) 0 calc(10px + env(safe-area-inset-left,0px))}
.pill{background:var(--panel);border-radius:999px;padding:0 14px 0 8px;height:44px;display:flex;align-items:center;gap:6px;font-size:24px;line-height:1;box-shadow:0 4px 0 var(--edge)}
.pill b{min-width:1.4ch;text-align:right;padding-top:3px}
.pill.bump{animation:bump .3s}
.sp{flex:1}
.rb{width:44px;height:44px;border-radius:50%;background:var(--panel);box-shadow:0 4px 0 var(--edge);font-size:20px;display:grid;place-items:center;padding:0}
.rb svg{width:22px;height:22px}
#prog{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(70vw,360px);display:flex;align-items:center;gap:8px;font-size:28px}
#prog i{flex:1;height:20px;border-radius:999px;background:var(--panel);box-shadow:0 4px 0 var(--edge);overflow:hidden;display:block}
#prog b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--aqua),#7ef0c8);border-radius:999px;transition:width .15s}
.mood{position:absolute;left:0;top:0;font-size:26px;text-align:center;will-change:transform}
.mood span{display:block;line-height:1}
.mood i{display:block;width:38px;height:7px;border-radius:9px;background:var(--panel);overflow:hidden;border:1.5px solid var(--edge);margin:2px auto 0}
.mood b{display:block;height:100%;background:#4cd964}
#hint{position:absolute;left:50%;top:48%;font-size:64px;margin:-32px 0 0 -32px;animation:rub 1.1s ease-in-out infinite;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
#bottom{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 calc(12px + env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px))}
#nav{display:flex;gap:10px}
.nb{width:62px;height:62px;border-radius:20px;background:var(--panel);font-size:30px;box-shadow:0 6px 0 var(--edge);position:relative;padding:0}
.nb.on{background:var(--duck);transform:translateY(4px);box-shadow:0 2px 0 var(--edge)}
.nb.alert{animation:hop .45s infinite alternate}
.nb.alert::after{content:"❗";position:absolute;top:-14px;right:-8px;font-size:24px}
.nb .rob{position:absolute;right:-6px;bottom:-6px;font-size:18px}
.nb.mode{border-radius:50%;background:var(--aqua);margin-left:8px}
#bShop{width:76px;height:76px;border-radius:50%;background:var(--pink);font-size:36px;box-shadow:0 6px 0 #c9417f;padding:0}
#bShop.pulse{animation:pulse .6s infinite alternate}
#shop{position:absolute;inset:0;background:var(--dim);display:grid;place-items:center;pointer-events:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
#shop[hidden]{display:none}
#shopIn{background:var(--panel);border-radius:28px;box-shadow:0 8px 0 var(--edge);padding:16px;width:min(94vw,620px);max-height:100%;overflow:auto;touch-action:pan-y;position:relative}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:12px;margin-top:44px}
.card{background:#fff;border-radius:20px;padding:10px 4px 8px;box-shadow:0 5px 0 var(--aqua);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;min-height:124px;color:#173a5e !important}
.card .ia{font-size:40px;line-height:1.1}
.card .ib{position:absolute;right:8px;top:6px;font-size:22px}
.card .pips{font-size:11px;letter-spacing:3px;height:14px;color:#35b6e8}
.card .pr{font-size:20px;background:var(--duck);border-radius:999px;padding:0 10px;line-height:1.5}
.card.poor{box-shadow:0 5px 0 #c7d0d8}.card.poor .pr{background:#e3e8ec;color:#8a97a3}.card.poor .ia{opacity:.6}
.card.lock{box-shadow:0 5px 0 #c7d0d8;opacity:.55}.card.lock .pr{background:none}
.card.max{box-shadow:0 5px 0 #4cd964}.card.max .pr{background:none}
.card.ok{animation:pulse .7s infinite alternate}
#bClose{position:absolute;right:12px;top:12px;width:46px;height:46px;border-radius:50%;background:var(--pink);font-size:22px;box-shadow:0 4px 0 #c9417f;color:#fff !important}
#bReset{position:absolute;left:12px;top:12px;width:46px;height:46px;border-radius:50%;background:transparent;font-size:20px;opacity:.5}
#bReset.arm{background:#ff5c5c;opacity:1}
.fl{position:absolute;font-size:30px;transform:translate(-50%,-50%);animation:rise 1.2s ease-out forwards;text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff;color:#173a5e;white-space:nowrap}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;background:radial-gradient(circle at 50% 30%,#d6f6ff,#6fd0ee 70%,#35b6e8);padding:16px;text-align:center}
#start h1{margin:0;font-size:clamp(44px,13vw,110px);line-height:.95;color:#fff;-webkit-text-stroke:3px #173a5e;paint-order:stroke fill;text-shadow:0 7px 0 #173a5e;letter-spacing:-.01em}
#start .row{font-size:clamp(30px,9vw,62px);letter-spacing:.06em}
#bPlay{width:clamp(110px,30vw,170px);aspect-ratio:1;border-radius:50%;background:var(--duck);font-size:clamp(48px,13vw,80px);box-shadow:0 10px 0 #c79a00;padding:0 0 0 .12em;animation:pulse .8s infinite alternate;color:#173a5e !important}
@keyframes pulse{to{transform:scale(1.09)}}
@keyframes hop{to{transform:translateY(-9px)}}
@keyframes bump{50%{transform:scale(1.2)}}
@keyframes rise{from{opacity:1}to{opacity:0;margin-top:-90px}}
@keyframes rub{0%,100%{transform:translate(-46px,-10px) rotate(-12deg)}50%{transform:translate(46px,14px) rotate(12deg)}}
@media (prefers-reduced-motion:reduce){#bShop.pulse,.card.ok,#bPlay,.nb.alert{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui" hidden>
  <div id="top">
    <div class="pill" id="coinP"><span>🪙</span><b id="coins">0</b></div>
    <div class="pill"><span>🐾</span><b id="rate">0</b><span>⏱️</span></div>
    <div class="sp"></div>
    <button class="rb" id="bMus" aria-label="Dźwięk">🔊</button>
    <button class="rb" id="bFs" aria-label="Pełny ekran"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <div id="prog" hidden><span id="progIc">🧽</span><i><b id="progB"></b></i></div>
  <div id="moods"></div>
  <div id="hint" hidden>👆</div>
  <div id="floaters"></div>
  <div id="bottom"><div id="nav"></div><button id="bShop" aria-label="Sklep">🛒</button></div>
  <div id="shop" hidden><div id="shopIn"><button id="bReset" aria-label="Zacznij od nowa">🗑️</button><button id="bClose" aria-label="Zamknij">✖</button><div id="cards"></div></div></div>
</div>
<div id="start"><h1>Pralnia Zoo</h1><div class="row">🐘🦒🦓🦛🐊<br>🦁🐯🐼🐧🦘</div><button id="bPlay" aria-label="Graj">▶</button><div class="row">🫧🧽🫧</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../lib/ciuchcia-taxi-zniwa-pralnia-arka-rafa.js"></script>
<script src="../lib/pralnia-arka-rafa.js"></script>
<script src="../lib/pralnia-arka.js"></script>
<script src="../models/zwierzeta.pralnia-arka.js"></script>
<script src="../models/akcesoria.pralnia.js"></script>
<script src="../models/przyroda.pralnia.js"></script>
<script src="../models/zwierzeta.pralnia.js"></script>
<script src="game.js"></script>
</body>
</html>
