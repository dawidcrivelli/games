<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Żniwa! Kombajn i Ursus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --sky:#8fcdf0;
  --plate:#fff4d6;        /* emaliowana tabliczka */
  --plate-edge:#c9a35a;
  --ink:#3b2a17;
  --ursus:#d9432a;
  --ursus-edge:#9c2a18;
  --wheat:#f2b632;
  --leaf:#3f8f3a;
  --panel:rgba(255,246,222,.94);
  --shade:rgba(60,35,5,.35);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --plate:#4a3a26; --plate-edge:#241a0e; --ink:#fdeecb;
    --panel:rgba(43,32,20,.94); --shade:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --plate:#4a3a26; --plate-edge:#241a0e; --ink:#fdeecb;
  --panel:rgba(43,32,20,.94); --shade:rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);
  font-family:var(--font);color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}

/* ---------- przyciski ---------- */
.btn{font:800 1.15rem/1 var(--font);color:var(--ink);background:var(--plate);
  border:0;border-radius:20px;padding:0;margin:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:0 5px 0 var(--plate-edge),0 9px 14px var(--shade);
  transition:transform .06s, box-shadow .06s}
.btn:active,.btn.on{transform:translateY(4px);box-shadow:0 1px 0 var(--plate-edge),0 3px 6px var(--shade)}
.btn:focus-visible{outline:4px solid var(--wheat);outline-offset:3px}
.btn small{font-size:.72rem;font-weight:600;line-height:1}
.btn .ico{font-size:1.7rem;line-height:1}
.btn svg{display:block}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;
  padding:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px))
          calc(14px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px))}
#hud[hidden]{display:none}
#hud>*{pointer-events:auto;position:absolute}
#stats{top:calc(10px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));
  display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 96px);pointer-events:none}
.stat{background:var(--panel);border-radius:16px;padding:4px 12px 4px 8px;height:40px;
  display:flex;align-items:center;gap:6px;font-weight:800;font-size:1.35rem;
  box-shadow:0 3px 0 var(--plate-edge)}
.stat small{font-size:.9rem;font-weight:600;opacity:.7}
.stat .e{font-size:1.35rem}
.bar{width:84px;height:16px;border-radius:9px;background:rgba(120,90,40,.28);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--leaf);border-radius:9px;transition:width .25s}
.bale{width:24px;height:17px;border-radius:4px;background:
  linear-gradient(90deg,transparent 22%,#9a6b1c 22% 30%,transparent 30% 70%,#9a6b1c 70% 78%,transparent 78%),var(--wheat);
  box-shadow:inset 0 -3px 0 rgba(120,70,0,.3)}
#bMenu{top:calc(10px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));
  width:52px;height:48px;border-radius:16px}
#pad{left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  --k:clamp(58px,17vmin,86px);display:grid;gap:6px;
  grid-template:repeat(3,var(--k))/repeat(3,var(--k))}
#pad .btn{width:var(--k);height:var(--k);background:var(--ursus);color:#fff;
  box-shadow:0 5px 0 var(--ursus-edge),0 9px 14px var(--shade)}
#pad .btn:active,#pad .btn.on{box-shadow:0 1px 0 var(--ursus-edge),0 3px 6px var(--shade)}
#pU{grid-area:1/2}#pL{grid-area:2/1}#pR{grid-area:2/3}#pD{grid-area:3/2}
#bCal{left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:76px;height:76px}
#acts{right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:12px;align-items:flex-end}
#acts .btn{width:clamp(66px,18vmin,84px);height:clamp(60px,16vmin,76px)}
#bSwap{background:var(--wheat)!important;color:#3b2a17!important}
#bTool{background:#cfe3ff!important;color:#17324f!important}
.grain{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe27a,#e0a51c);box-shadow:inset 0 -2px 0 rgba(120,70,0,.3)}
#pick{left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:min(94vw,560px);
  background:var(--panel);padding:14px;border-radius:24px;box-shadow:0 6px 0 var(--plate-edge),0 16px 36px var(--shade)}
#pick .btn{width:96px;height:84px}#pick .btn[aria-pressed="true"]{background:var(--wheat);color:#3b2a17}
.em{font-size:1.9rem;line-height:1}.btn small{white-space:nowrap}
@media (max-height:440px){#acts{gap:7px}#acts .btn{height:clamp(50px,14.5vmin,64px)}}
#bSwap.pulse{animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.14) rotate(-3deg)}}
#toast{left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);
  background:var(--panel);padding:8px 16px;border-radius:14px;font-weight:600;font-size:1rem;
  max-width:86vw;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none!important;
  box-shadow:0 3px 0 var(--plate-edge)}
#toast.show{opacity:1}
body.tilt #pad{display:none}
body:not(.tilt) #bCal{display:none}

/* ---------- menu ---------- */
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(rgba(143,205,240,.15),rgba(242,182,50,.28));overflow:auto}
#menu[hidden]{display:none}
.card{background:var(--panel);border-radius:28px;padding:14px 18px 18px;width:min(460px,100%);
  box-shadow:0 7px 0 var(--plate-edge),0 18px 40px var(--shade);text-align:center}
h1{font-size:clamp(2.3rem,11vmin,3.6rem);line-height:.95;margin:0;font-weight:800;color:var(--ursus);
  letter-spacing:-.01em;text-shadow:0 3px 0 var(--plate-edge)}
.sub{margin:2px 0 10px;font-size:1.05rem;font-weight:600}
.q{font-size:1rem;font-weight:600;margin:10px 0 6px;text-align:left}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{height:66px;font-size:1.15rem;flex-direction:row;gap:8px}
.pick .ico{font-size:1.9rem}
.pick[aria-pressed="true"]{background:var(--wheat);color:#3b2a17;
  box-shadow:0 5px 0 #b07a12,0 9px 14px var(--shade)}
#bGo{width:100%;height:68px;margin-top:16px;font-size:1.7rem;background:var(--ursus);color:#fff;
  box-shadow:0 6px 0 var(--ursus-edge),0 10px 16px var(--shade)}
#bNew{width:100%;height:56px;margin-top:12px;font-size:1.25rem}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}
#bSnd{width:64px;height:48px;flex:none}
.foot p{margin:0;font-size:.82rem;font-weight:600;opacity:.75;text-align:left;line-height:1.25}
@media (orientation:landscape) and (max-height:480px){
  .card{width:min(680px,100%);padding:8px 16px 12px}
  h1{font-size:2rem;display:inline}.sub{display:inline;margin-left:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .pick{height:54px}#bGo{height:54px;margin-top:10px;font-size:1.4rem}#bNew{height:46px;margin-top:8px}
  .foot{margin-top:8px}
}
@media (prefers-reduced-motion:reduce){#bSwap.pulse{animation:none;outline:4px solid #fff}}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;
  text-align:center;font-size:1.2rem;font-weight:600;background:var(--sky);color:#3b2a17}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div id="stats">
    <div class="stat"><span class="e" id="cropIco">🌾</span><div class="bar"><i id="barFill"></i></div></div>
    <div class="stat"><span class="bale"></span><span id="trailerN">0</span><small id="trailerCap">/16</small></div>
    <div class="stat"><span class="e">🏠</span><span id="barnN">0</span></div>
    <div class="stat"><span class="grain"></span><span id="grainN">0</span></div>
    <div class="stat" style="padding:4px 9px"><span class="e" id="wx">☀️</span></div>
  </div>
  <button class="btn" id="bMenu" aria-label="Menu"><span class="ico" style="font-size:1.4rem">⚙️</span></button>
  <div id="pad">
    <button class="btn" id="pU" data-k="up" aria-label="Do przodu"></button>
    <button class="btn" id="pL" data-k="left" aria-label="W lewo"></button>
    <button class="btn" id="pR" data-k="right" aria-label="W prawo"></button>
    <button class="btn" id="pD" data-k="down" aria-label="Do tyłu"></button>
  </div>
  <button class="btn" id="bCal" aria-label="Ustaw środek przechylania"><span class="ico">🎯</span><small>środek</small></button>
  <div id="pick" hidden></div>
  <div id="acts">
    <button class="btn" id="bTool" aria-label="Zmień narzędzie" hidden><span class="ico" id="toolIco">🟤</span><small id="toolLbl">Pług</small></button>
    <button class="btn" id="bHorn" aria-label="Klakson"><span class="ico">📯</span></button>
    <button class="btn" id="bCam" aria-label="Zmień widok"><span class="ico">🎥</span><small id="camLbl">z góry</small></button>
    <button class="btn" id="bSwap" aria-label="Zmień pojazd"><span id="swapIco"></span><small id="swapLbl">Ursus</small></button>
  </div>
  <div id="toast" role="status"></div>
</div>

<div id="menu">
  <div class="card">
    <h1 id="mTitle">Żniwa!</h1>
    <p class="sub" id="mSub">Żniwa, orka, siew i zwierzaki</p>
    <div class="grid2">
      <div>
        <p class="q">Co zbieramy?</p>
        <div class="row">
          <button class="btn pick" data-crop="wheat" aria-pressed="true"><span class="ico">🌾</span>Zboże</button>
          <button class="btn pick" data-crop="corn" aria-pressed="false"><span class="ico">🌽</span>Kukurydza</button>
        </div>
      </div>
      <div>
        <p class="q">Jak kierujemy?</p>
        <div class="row">
          <button class="btn pick" data-ctrl="arrows" aria-pressed="true"><span class="ico">🕹️</span>Strzałki</button>
          <button class="btn pick" data-ctrl="tilt" aria-pressed="false"><span class="ico">📱</span>Przechylanie</button>
        </div>
      </div>
    </div>
    <button class="btn" id="bGo">Jedziemy!</button>
    <button class="btn" id="bNew" hidden>Nowe pole</button>
    <div class="foot">
      <p>Skoś pole i zawieź kostki słomy do stodoły. Reszta (ziarno, prasa, orka, siew) jest dla chętnych.</p>
      <button class="btn" id="bSnd" aria-label="Dźwięk"><span class="ico" id="sndIco" style="font-size:1.4rem">🔊</span></button>
    </div>
  </div>
</div>
<div id="err">Nie udało się wczytać silnika 3D. Sprawdź internet i odśwież stronę.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
if (!window.THREE) { $('err').style.display = 'flex'; $('menu').hidden = true; return; }
const T = THREE;

/* =====================================================================
   USTAWIENIA I STAN
   ===================================================================== */
const S = { crop:'wheat', ctrl:'arrows', cam:0, active:'combine', muted:false, running:false, menu:'start' };
try {
  const sv = JSON.parse(localStorage.getItem('zniwa') || 'null');
  if (sv) { if (sv.crop==='corn'||sv.crop==='wheat') S.crop = sv.crop; if (sv.ctrl==='tilt'||sv.ctrl==='arrows') S.ctrl = sv.ctrl; S.muted = !!sv.muted; }
} catch (e) {}
const save = () => { try { localStorage.setItem('zniwa', JSON.stringify({crop:S.crop, ctrl:S.ctrl, muted:S.muted})); } catch (e) {} };

const FW = 56, FD = 36, CELLS = FW*FD;        // pole w metrach (1 komórka = 1 m)
const X0 = -FW/2, Z0 = -FD/2;
const WORLD = { x:46, zMin:-23, zMax:32 };
const BARN_X = 14, BARN_DOOR = new T.Vector3(BARN_X, 2.2, -30.2);
const CELLS_PER_BALE = 40, TRAILER_CAP = 16;

let seed = 12345;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rr = (a, b) => a + rnd()*(b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hash2 = (x, y) => { const s = Math.sin(x*127.1 + y*311.7)*43758.5453; return s - Math.floor(s); };
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf*xf*(3 - 2*xf), v = yf*yf*(3 - 2*yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1); return a + (b - a)*u + (c - a)*v + (a - b - c + d)*u*v; }
const wrap = a => { while (a > Math.PI) a -= 2*Math.PI; while (a < -Math.PI) a += 2*Math.PI; return a; };

/* =====================================================================
   RENDERER, SCENA, ŚWIATŁO
   ===================================================================== */
const renderer = new T.WebGLRenderer({ canvas:$('c'), antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
const scene = new T.Scene();
scene.fog = new T.Fog(0xcfe8f3, 110, 420);
const camera = new T.PerspectiveCamera(55, 1, 0.12, 900);
scene.add(camera);

const hemi = new T.HemisphereLight(0xdff1ff, 0x7d7040, 0.56); scene.add(hemi);
const sun = new T.DirectionalLight(0xfff1d0, 0.72);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera; sc.left = -19; sc.right = 19; sc.top = 19; sc.bottom = -19; sc.near = 1; sc.far = 160;
sun.shadow.bias = -0.0006;
scene.add(sun); scene.add(sun.target);
const SUN_DIR = new T.Vector3(26, 46, 20);

/* ---------- tekstury z canvasu ---------- */
function tex(w, h, draw, rx, ry) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(rx || 1, ry || 1);
  t.anisotropy = 4; return t;
}
const grassTex = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#69a84a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 5000; i++) { g.strokeStyle = ['#5c9a40','#78b656','#4f8c38','#86c060'][i&3]; g.globalAlpha = .55;
    const x = rnd()*w, y = rnd()*h; g.beginPath(); g.moveTo(x, y); g.lineTo(x + rr(-2,2), y - rr(2,6)); g.stroke(); }
}, 90, 90);
const soilTex = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#a17c45'; g.fillRect(0, 0, w, h);
  for (let r = 0; r < 8; r++) { g.fillStyle = 'rgba(236,214,150,.6)'; g.fillRect(0, r*32 + 10, w, 9); g.fillStyle = 'rgba(110,80,40,.35)'; g.fillRect(0, r*32 + 24, w, 5); }
  for (let i = 0; i < 2600; i++) { g.fillStyle = ['#e9cf86','#8f6c38','#d7b565','#c29a55'][i&3]; g.globalAlpha = .6; g.fillRect(rnd()*w, rnd()*h, rr(2,7), 1.5); }
}, FW/4, FD/4);
const strawTex = tex(128, 128, (g, w, h) => {
  g.fillStyle = '#e3b643'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1400; i++) { g.strokeStyle = ['#f3d06a','#c9982c','#eec455','#b98722'][i&3]; g.globalAlpha = .8;
    const x = rnd()*w, y = rnd()*h; g.beginPath(); g.moveTo(x, y); g.lineTo(x + rr(4,16), y + rr(-2,2)); g.stroke(); }
  g.globalAlpha = 1; g.fillStyle = '#8a5a14'; g.fillRect(0, 36, w, 5); g.fillRect(0, 88, w, 5);
});
const woodTex = tex(128, 128, (g, w, h) => {
  g.fillStyle = '#9b6a3c'; g.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 16) { g.fillStyle = ['#8c5e33','#a87646','#93633a','#a06e40'][(x/16)&3]; g.fillRect(x + 1, 0, 14, h); g.fillStyle = '#5e3d20'; g.fillRect(x, 0, 1.5, h); }
  for (let i = 0; i < 300; i++) { g.fillStyle = 'rgba(70,40,15,.25)'; g.fillRect(rnd()*w, rnd()*h, 1, rr(4,18)); }
}, 5, 1);

/* ---------- materiały ---------- */
const lam = (c, o) => new T.MeshLambertMaterial(Object.assign({ color:c }, o));
const pho = (c, o) => new T.MeshStandardMaterial(Object.assign({ color:c, roughness:.34, metalness:.25, envMapIntensity:.85 }, o));   // lakier odbijający niebo
const M = {
  tire:pho(0x1f1d1c, { roughness:.93, metalness:0, envMapIntensity:.25 }), dark:lam(0x2e3034), steel:pho(0x8f989f, { metalness:.7, roughness:.38 }), steelL:pho(0xc7ced3, { metalness:.7, roughness:.3 }), chrome:pho(0xe6eaee, { metalness:.95, roughness:.12, envMapIntensity:1.2 }),
  cBlue:pho(0xa6c21a), cBlueD:pho(0x7f9712), cRed:pho(0xd8301f), cYel:pho(0xf5c41f), white:pho(0xf5f1e6),
  uRed:pho(0xdc452a), uGray:pho(0x5f6367), uCream:pho(0xeee2c4),
  glass:new T.MeshStandardMaterial({ color:0xbfe6f5, transparent:true, opacity:.26, roughness:.04, metalness:.2, envMapIntensity:1.7, depthWrite:false }),
  skin:lam(0xf1c7a0), hat:lam(0xe8c56a), shirt:lam(0x3c8a4a), pants:lam(0x34446a),
  wood:lam(0xffffff, { map:woodTex }), woodL:lam(0xc79a63), roof:lam(0xb23a2c), inside:lam(0x1d140d),
  trGreen:pho(0x3f8a3c), bedWood:lam(0xb98a55), grain:lam(0xf0c040),
  lamp:new T.MeshBasicMaterial({ color:0xfff3b0 }), beacon:new T.MeshBasicMaterial({ color:0xffa200 }),
  gaugeW:new T.MeshBasicMaterial({ color:0xf6f2e2 }), gaugeR:new T.MeshBasicMaterial({ color:0xe23b2b }), gaugeG:new T.MeshBasicMaterial({ color:0x49c24f }),
  cRedD:pho(0xa82f20), uRedD:pho(0xb0351f), uGrayD:pho(0x3d4144), trGreenD:pho(0x2f6a2d), woodD:lam(0x7d5a36), seat:lam(0x23201e), hair:lam(0x4a3524), boot:lam(0x2a221c),
  red:new T.MeshBasicMaterial({ color:0xd81f1f }), amber:new T.MeshBasicMaterial({ color:0xff9a1a }),
  hazardY:lam(0xffffff, { map:tex(64, 64, (g, w, h) => { g.fillStyle = '#f2c21f'; g.fillRect(0, 0, w, h); g.fillStyle = '#1c1c1c'; for (let i = -2; i < 4; i++) { g.beginPath(); g.moveTo(i*32, 0); g.lineTo(i*32 + 16, 0); g.lineTo(i*32 + 80, 64); g.lineTo(i*32 + 64, 64); g.fill(); } }) }),
  hazard:lam(0xffffff, { map:tex(64, 64, (g, w, h) => { g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.fillStyle = '#d6201f'; for (let i = -2; i < 4; i++) { g.beginPath(); g.moveTo(i*32, 0); g.lineTo(i*32 + 16, 0); g.lineTo(i*32 + 80, 64); g.lineTo(i*32 + 64, 64); g.fill(); } }) }),

  cv.addEventListener('pointerdown', e => { if (!S.running || S.cam === 0 || lookA.id !== null) return; lookA.id = e.pointerId; lookA.x = e.clientX; lookA.y = e.clientY; try { cv.setPointerCapture(e.pointerId); } catch (_) {} });
  cv.addEventListener('pointermove', e => { if (e.pointerId !== lookA.id) return;
    lookA.yaw = clamp(lookA.yaw + (e.clientX - lookA.x)*.007, -2.7, 2.7); lookA.pitch = clamp(lookA.pitch + (e.clientY - lookA.y)*.005, -.5, .6);
    lookA.x = e.clientX; lookA.y = e.clientY; lookA.idle = 0; });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => cv.addEventListener(ev, e => { if (e.pointerId === lookA.id) lookA.id = null; })); }
const lookDir = new T.Vector3();
function updateCamera(dt) {

  let fov = 55;

    camPos.copy(wantPos); camLook.copy(wantLook); fov = portrait ? 70 : 52;
  } else {
    const A = veh[S.active];
    if (lookA.id === null) { lookA.idle += dt; if (lookA.idle > .7) { const k = Math.exp(-dt*3); lookA.yaw *= k; lookA.pitch *= k; } }
    if (S.cam === 0) { const H = portrait ? 31 : 21; wantPos.set(A.x, H, A.z + H*.62); wantLook.set(A.x, 0, A.z - 1.5); fov = 52; }
    else if (S.cam === 1) { camH += wrap(A.h - camH)*Math.min(1, dt*3.5); const k = portrait ? 1.3 : 1;
      const ca = camH + lookA.yaw, hk = clamp(1 - lookA.pitch*1.2, .35, 1.7);
      wantPos.set(A.x - Math.sin(ca)*A.chase[0]*k, A.chase[1]*k*hk, A.z - Math.cos(ca)*A.chase[0]*k);
      wantLook.set(A.x + Math.sin(A.h)*4, A.lookY || 1.6, A.z + Math.cos(A.h)*4); fov = portrait ? 66 : 55; }
    else { A.inner.localToWorld(wantPos.copy(A.eye)); wantPos.y += A.walk !== undefined ? 0 : Math.sin(time*38)*.006*(.4 + A.rpm);
      lookDir.copy(A.look).sub(A.eye); const yw = lookA.yaw + A.steer*.3, pt = Math.atan2(lookDir.y, lookDir.z) + lookA.pitch, cp = Math.cos(pt);
      tmpV.set(A.eye.x + Math.sin(yw)*cp*6, A.eye.y + Math.sin(pt)*6, A.eye.z + Math.cos(yw)*cp*6); A.inner.localToWorld(wantLook.copy(tmpV)); fov = portrait ? 88 : 68; camSnap = true; }
    if (camSnap) { camPos.copy(wantPos); camLook.copy(wantLook); camH = A.h; camSnap = false; }
    else { const k = 1 - Math.exp(-dt*6); camPos.lerp(wantPos, k); camLook.lerp(wantLook, k); }
    ORDER.forEach(n => { veh[n].driver.visible = !(S.cam === 2 && S.active === n); });
    sun.target.position.set(A.x, 0, A.z); sun.position.copy(sun.target.position).add(SUN_DIR);
    if (headLamp.intensity > 0) { A.inner.localToWorld(headLamp.position.copy(A.eye).add(tmpV.set(0, .3, .9))); A.inner.localToWorld(headLamp.target.position.copy(A.eye).add(tmpV.set(0, -2.6, 15))); }

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); addEventListener('orientationchange', () => setTimeout(resize, 250)); resize();

/* =====================================================================

const ICO_TRACTOR = '<svg viewBox="0 0 48 32" width="46" height="30" aria-hidden="true"><rect x="20" y="10" width="20" height="9" rx="2" fill="#d9432a"/><rect x="10" y="6" width="12" height="14" rx="2" fill="#d9432a"/><rect x="33" y="3" width="2.5" height="8" fill="#333"/><circle cx="14" cy="21" r="9" fill="#262321"/><circle cx="14" cy="21" r="4" fill="#eee2c4"/><circle cx="38" cy="25" r="5" fill="#262321"/><circle cx="38" cy="25" r="2" fill="#eee2c4"/></svg>';
const ICO_COMBINE = '<svg viewBox="0 0 48 32" width="46" height="30" aria-hidden="true"><rect x="4" y="8" width="24" height="13" rx="2" fill="#a6c21a"/><rect x="22" y="3" width="10" height="11" rx="2" fill="#a9d8ee" stroke="#55651a" stroke-width="1.5"/><path d="M30 17 L38 22 L46 22 L46 29 L36 29 Z" fill="#7f9712"/><circle cx="41" cy="20" r="5" fill="none" stroke="#d8301f" stroke-width="2"/><circle cx="20" cy="23" r="7" fill="#262321"/><circle cx="20" cy="23" r="3" fill="#d8301f"/><circle cx="7" cy="26" r="4" fill="#262321"/></svg>';
const CAM_NAMES = ['z góry', 'z tyłu', 'kabina'];
const ICO_BIG = ICO_TRACTOR.replace(/#d9432a/g, '#1f5fb8').replace(/#eee2c4/g, '#ffffff');

function hud() {
  const car = carrier() || CAR.tractor; $('trailerN').textContent = car.bales.length; $('trailerCap').textContent = '/' + car.cap; $('barnN').textContent = stored;
  $('swapIco').innerHTML = VEH_UI[S.active][0]; $('swapLbl').textContent = 'zmień';
  $('camLbl').textContent = S.cam === 2 && veh[S.active].walk !== undefined ? 'grzbiet' : CAM_NAMES[S.cam];

let toastT = 0;

function horn() { if (S.active === 'giraffe') sfx.giraffe(); else if (S.active === 'elephant') sfx.trumpet(); else sfx.horn(S.active === 'tractor'); }
function nextCam() { S.cam = (S.cam + 1) % 3; lookA.yaw = lookA.pitch = 0; camSnap = S.cam === 2; hud(); }
function selectVehicle(n) { $('pick').hidden = true; if (n === S.active) return; veh[S.active].v = 0; veh[S.active].rpm = 0; S.active = n;
  veh[n].rpm = .9; camSnap = S.cam === 2; camH = veh[n].h; lookA.yaw = lookA.pitch = 0; hud();
  if (n === 'giraffe') sfx.giraffe(); else if (n === 'elephant') sfx.trumpet(); else tone(90, .35, 'sawtooth', .18, 160); }
function swapVehicle() { $('pick').hidden = !$('pick').hidden; }
function nextTool() { const B = veh.big; B.tool = TOOLS[(TOOLS.indexOf(B.tool) + 1) % 3]; TOOLS.forEach(k => { B.P.tools[k].visible = k === B.tool; }); tone(180, .12, 'square', .12, 260); hud(); }
$('pick').innerHTML = ORDER.map(n => '<button class="btn" data-v="' + n + '">' + VEH_UI[n][0] + '<small>' + VEH_UI[n][1] + '</small></button>').join('');
document.querySelectorAll('#pick [data-v]').forEach(b => b.addEventListener('click', () => selectVehicle(b.dataset.v)));
const tap = (id, fn) => $(id).addEventListener('click', e => { e.preventDefault(); fn(); });
tap('bHorn', horn); tap('bCam', nextCam); tap('bSwap', swapVehicle); tap('bTool', nextTool); tap('bMenu', () => showMenu('pause'));

function syncPicks() {
  document.querySelectorAll('[data-crop]').forEach(b => b.setAttribute('aria-pressed', b.dataset.crop === S.crop));
  document.querySelectorAll('[data-ctrl]').forEach(b => b.setAttribute('aria-pressed', b.dataset.ctrl === S.ctrl));
  $('sndIco').textContent = S.muted ? '🔇' : '🔊';
}
document.querySelectorAll('[data-crop]').forEach(b => b.addEventListener('click', () => { S.crop = b.dataset.crop; syncPicks(); save();
  if (S.menu === 'start' && S.crop !== fieldCrop) buildField(S.crop); }));
document.querySelectorAll('[data-ctrl]').forEach(b => b.addEventListener('click', () => { S.ctrl = b.dataset.ctrl; syncPicks(); save(); }));
tap('bSnd', () => { S.muted = !S.muted; if (AU.ctx) AU.master.gain.value = S.muted ? 0 : .7; syncPicks(); save(); });

function showMenu(kind) {
  S.menu = kind; S.running = false; keys.up = keys.down = keys.left = keys.right = 0;
  setEngine('combine', 0, false); setEngine('tractor', 0, false); setEngine('big', 0, false); $('pick').hidden = true;

async function startGame(fresh) {

tap('bGo', () => startGame(false)); tap('bNew', () => startGame(true));

   START
   ===================================================================== */

syncPicks(); hud();
let last = performance.now(), lastRaw = last, qAcc = 0, qN = 0, qLevel = 0;   // gdy telefon nie nadąża: mniej pikseli, potem bez cieni
