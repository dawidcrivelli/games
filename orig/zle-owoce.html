<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Złe Owoce</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1b14;--paper:#f3e7cb;--card:#fffaf0;--sun:#ffd23f;--berry:#e8404f;--leaf:#6fcf6a;--grape:#a878e8;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#2b1b14;color:var(--ink);font-family:"Patrick Hand","Comic Sans MS","Chalkboard SE",cursive,sans-serif;overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:none}
#fit{position:relative;width:100%;height:100%;padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px);overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:800px;height:450px;transform-origin:center;background:var(--paper);overflow:hidden;border-radius:14px}
#c{position:absolute;inset:0;width:800px;height:450px}
.scr{position:absolute;inset:0}
[hidden]{display:none!important}
button{font:inherit;color:var(--ink);cursor:pointer;border:3.5px solid var(--ink);border-radius:18px 14px 20px 13px/14px 20px 13px 18px;background:var(--card);box-shadow:2px 4px 0 var(--ink);touch-action:none}
button:active{transform:translate(1px,3px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible{outline:3px dashed var(--ink);outline-offset:2px}
.big{font-size:30px;line-height:1.15;padding:2px 30px 4px;background:var(--berry);color:#fff}
.mini{position:absolute;width:42px;height:42px;font-size:20px;border-radius:50%;padding:0;z-index:5}
#fs{right:10px;top:10px}
#title{text-align:center}
#title h1{font-family:"Baloo 2","Arial Rounded MT Bold",sans-serif;margin:10px 0 0;font-size:92px;line-height:1;color:var(--sun);transform:rotate(-4deg);
  text-shadow:4px 4px 0 var(--ink),-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink),0 9px 0 var(--berry),0 13px 0 var(--ink)}
#title p{font-size:26px;margin:20px 0 0}
#title .big{position:absolute;left:50%;bottom:24px;margin-left:-110px;width:220px;font-size:40px}
/* kreator */
#hd{position:absolute;left:306px;top:4px;font-size:30px;line-height:44px}
#mute{left:470px;top:5px}
#wn{position:absolute;right:14px;top:4px;font-size:22px;line-height:44px;white-space:nowrap}
#msg{position:absolute;left:10px;width:286px;top:8px;text-align:center;font-size:20px;line-height:1.1;background:var(--sun);border:3px solid var(--ink);border-radius:14px;padding:4px 6px;z-index:4}
#slots{position:absolute;left:10px;top:10px;font-size:20px}
#nm{position:absolute;left:6px;width:292px;top:368px;text-align:center;font-size:26px;line-height:1}
#pw{position:absolute;left:22px;width:262px;top:404px;display:flex;align-items:center;gap:8px;font-size:24px}
.bar{flex:1;height:22px;border:3.5px solid var(--ink);border-radius:12px 9px 13px 8px;background:#0002;overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:linear-gradient(90deg,var(--leaf),var(--sun),var(--berry));transition:width .25s}
#panel{position:absolute;left:302px;right:8px;top:52px;bottom:8px;background:var(--card);border:3.5px solid var(--ink);border-radius:22px 16px 24px 15px/16px 24px 15px 22px;padding:7px}
#tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
#tabs button{font-size:14px;line-height:1;padding:2px 0 3px;background:#e6dcc4;box-shadow:1px 3px 0 var(--ink)}
#tabs button span{display:block;font-size:22px;line-height:1.15}
#tabs button.on{background:var(--sun)}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.it{height:57px;padding:0;position:relative;overflow:hidden;box-shadow:1px 3px 0 var(--ink)}
.it canvas{width:62px;height:52px;display:block;margin:0 auto;pointer-events:none}
.it b{position:absolute;right:4px;bottom:-1px;font-size:14px;font-weight:400}
.it.on{background:var(--leaf)}
.it.lock{background:#cfc6b2}
.it.lock canvas{opacity:.25}
.it.lock b{left:0;right:0;top:14px;bottom:auto;font-size:19px;text-align:center}
#go{position:absolute;right:9px;bottom:8px}
#clr{position:absolute;left:9px;bottom:8px;font-size:20px;padding:4px 14px}
#rnd{position:absolute;left:126px;bottom:8px;font-size:20px;padding:4px 14px;background:var(--sun)}
#bin{position:absolute;left:302px;right:8px;top:52px;bottom:8px;border-radius:22px;background:#e8404fdd;color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;text-align:center;z-index:3;pointer-events:none}
/* walka */
.hp{position:absolute;top:10px;width:320px}
.hp .bar{height:26px;background:#fff8}.hp .bar i{background:var(--leaf);transition:width .15s}
.hp span{display:block;font-size:20px;line-height:1.2;white-space:nowrap}
#hpP{left:12px}#hpE{right:12px;text-align:right}#hpE .bar i{background:var(--berry);margin-left:auto}
#lvl{position:absolute;left:0;right:0;top:50px;text-align:center;font-size:20px}
#quit{left:331px;top:6px}#mute2{left:427px;top:6px}
.act{position:absolute;width:88px;height:88px;border-radius:50%;font-size:17px;line-height:1;padding:0;overflow:hidden}
.act span{display:block;font-size:34px;line-height:1.1}
.act::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--cd,0)*100%);background:#2b1b14aa;pointer-events:none}
#bC{left:12px;bottom:14px;background:var(--sun)}
#bK{left:12px;bottom:116px;background:var(--leaf)}
#bB{right:12px;bottom:14px;background:var(--berry);color:#fff}
#bS{right:12px;bottom:116px;background:var(--grape);color:#fff}
#bS.ready{animation:pulse .5s infinite alternate}
@keyframes pulse{to{box-shadow:2px 4px 0 var(--ink),0 0 0 8px #ffd23f}}
#result{display:flex;align-items:center;justify-content:center;background:#2b1b1499;z-index:6}
#card{background:var(--card);border:4px solid var(--ink);border-radius:30px 22px 34px 20px/22px 34px 20px 30px;box-shadow:3px 7px 0 var(--ink);padding:8px 26px 20px;text-align:center;min-width:420px;max-width:660px}
#card h2{font-family:"Baloo 2","Arial Rounded MT Bold",sans-serif;margin:0;font-size:52px;line-height:1.1;color:var(--berry);text-shadow:3px 3px 0 var(--ink)}
#card p{margin:2px 0;font-size:23px;line-height:1.2}
#card .new{color:#6b2fd1}
#card div{display:flex;gap:14px;justify-content:center;margin-top:14px}
#card .big{font-size:26px;padding:2px 20px 4px}
#card .alt{background:var(--sun);color:var(--ink)}
#hint{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));text-align:center;font-size:16px;color:#f3e7cb;opacity:.85;display:none}
@media (orientation:portrait){#hint{display:block}}
@media (prefers-reduced-motion:reduce){#bS.ready{animation:none}}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <canvas id="c" width="1600" height="900"></canvas>
  <section id="title" class="scr">
    <h1>Złe Owoce</h1>
    <p>Zbuduj groźnego owoca i pokonaj potwory</p>
    <button class="mini" id="fs" aria-label="Pełny ekran" hidden>⤢</button>
    <button class="big" id="play">Graj</button>
  </section>
  <section id="creator" class="scr" hidden>
    <div id="slots"></div>
    <div id="msg" hidden></div>
    <div id="hd">Zbuduj owoca</div>
    <button class="mini" id="mute" aria-label="Dźwięk">🔊</button>
    <div id="wn"></div>
    <div id="nm"></div>
    <div id="pw"><span>💪</span><div class="bar"><i id="pwf"></i></div><span id="pwn"></span></div>
    <div id="panel">
      <div id="tabs"></div>
      <div id="grid"></div>
      <button id="clr">🧽 Od nowa</button>
      <button id="rnd">🎲 Losuj</button>
      <button class="big" id="go">Walcz!</button>
    </div>
    <div id="bin" hidden>🗑️<br>Upuść tutaj, żeby wyrzucić</div>
  </section>
  <section id="fight" class="scr" hidden>
    <div class="hp" id="hpP"><div class="bar"><i id="hpPf"></i></div><span id="hpPn"></span></div>
    <div class="hp" id="hpE"><div class="bar"><i id="hpEf"></i></div><span id="hpEn"></span></div>
    <button class="mini" id="quit" aria-label="Wróć do budowania">🔧</button>
    <button class="mini" id="mute2" aria-label="Dźwięk">🔊</button>
    <div id="lvl"></div>
    <button class="act" id="bK"><span>🦶</span>Kop</button>
    <button class="act" id="bC"><span>👊</span>Cios</button>
    <button class="act" id="bS"><span>💥</span>Super</button>
    <button class="act" id="bB"><span>🪓</span>Broń</button>
  </section>
  <section id="result" class="scr" hidden><div id="card"></div></section>
</div></div>
<div id="hint">Obróć telefon bokiem, będzie większe</div>

<script>
"use strict";
const INK='#2b1b14', $=id=>document.getElementById(id);
const cv=$('c'), c=cv.getContext('2d'); c.scale(2,2);
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ---------- silnik „ręcznej kreski” ---------- */
let g=c,BO=1,SC=0;
function hs(n){const x=Math.sin(n*127.1+BO*311.7)*43758.5453;return x-Math.floor(x)}
function P(pts,fill,o){o=o||{};const a=o.a===undefined?1.5:o.a,sd=(SC+=7.31),n=pts.length,q=[],p=new Path2D();
 for(let i=0;i<n;i++)q.push([pts[i][0]+(hs(sd+i)-.5)*2*a,pts[i][1]+(hs(sd+i+.5)-.5)*2*a]);
 const mid=(u,v)=>[(u[0]+v[0])/2,(u[1]+v[1])/2];
 if(o.s||n<3){p.moveTo(q[0][0],q[0][1]);for(let i=1;i<n;i++)p.lineTo(q[i][0],q[i][1]);if(!o.open)p.closePath()}
 else if(o.open){p.moveTo(q[0][0],q[0][1]);for(let i=1;i<n-1;i++){const m=mid(q[i],q[i+1]);p.quadraticCurveTo(q[i][0],q[i][1],m[0],m[1])}p.lineTo(q[n-1][0],q[n-1][1])}
 else{let m=mid(q[n-1],q[0]);p.moveTo(m[0],m[1]);for(let i=0;i<n;i++){m=mid(q[i],q[(i+1)%n]);p.quadraticCurveTo(q[i][0],q[i][1],m[0],m[1])}p.closePath()}
 if(fill){g.fillStyle=fill;g.fill(p)}
 if(!o.ns){g.lineWidth=(o.lw||4.2)*(.86+hs(sd+99)*.28);if(o.st)g.strokeStyle=o.st;g.stroke(p);if(o.st)g.strokeStyle=INK}
 return p}
function C(x,y,rx,ry,n){ry=ry===undefined?rx:ry;n=n||10;const r=[];for(let i=0;i<n;i++)r.push([x+Math.cos(i/n*6.2832)*rx,y+Math.sin(i/n*6.2832)*ry]);return r}
function R(x,y,w,h){return[[x,y],[x+w,y],[x+w,y+h],[x,y+h]]}
function L(x1,y1,x2,y2,lw,st){P([[x1,y1],[(x1+x2)/2,(y1+y2)/2],[x2,y2]],null,{open:1,lw:lw||3,st})}
function ST(x,y,n,r1,r2,rot){const r=[];for(let i=0;i<n*2;i++){const a=(rot||0)+i*Math.PI/n,k=i%2?r2:r1;r.push([x+Math.cos(a)*k,y+Math.sin(a)*k])}return r}
function LB(x1,y1,x2,y2,w,fill){const dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy)||1,nx=-dy/l*w,ny=dx/l*w;P([[x1+nx,y1+ny],[(x1+x2)/2+nx,(y1+y2)/2+ny],[x2+nx,y2+ny],[x2-nx,y2-ny],[(x1+x2)/2-nx,(y1+y2)/2-ny],[x1-nx,y1-ny]],fill)}
function pen(){g.strokeStyle=INK;g.lineJoin=g.lineCap='round'}
function shaded(pts,col,inner,lw){const p=P(pts,col,{ns:1});g.save();g.clip(p);g.fillStyle='rgba(70,20,40,.2)';g.fillRect(-200,-200,400,400);
 P(pts.map(q=>[q[0]-8,q[1]-9]),col,{ns:1});if(inner)inner();g.restore();g.lineWidth=lw||5.2;g.stroke(p)}
const EYE='#fffdf2',SK='#f6d3a6',WOOD='#b06f33',STEEL='#cfd8e3',DARK='#4a1830',GOLD='#ffd23f';
const dot=(x,y,r,col)=>P(C(x,y,r,r,7),col||INK,{ns:1,a:.5});

/* ---------- owoce ---------- */
const BASES={
 truskawka:{name:'Truskawka',lock:0,col:'#ee4354',pts:[[0,-52],[38,-58],[62,-30],[58,5],[38,38],[12,60],[0,64],[-12,60],[-38,38],[-58,5],[-62,-30],[-38,-58]],
  inn(){[[-36,-30],[34,-34],[-46,0],[46,-2],[-28,34],[26,36],[0,52],[-12,-46],[14,-44],[-10,10],[16,14]].forEach(q=>P(C(q[0],q[1],2.6,4.4,6),'#ffe27a',{ns:1,a:.6}))},
  out(){P(ST(0,-54,6,30,11,.26),'#57b85a',{lw:4})}},
 borowka:{name:'Borówka',lock:0,col:'#5a72e0',pts:C(0,2,56,54,12),
  inn(){P(C(-26,-28,13,7,7),'rgba(255,255,255,.3)',{ns:1})},out(){P(ST(0,-52,5,16,7,-1.57),'#2f3d8f',{lw:3.5,s:1})}},
 banan:{name:'Banan',lock:0,col:'#ffd94a',pts:[[-22,-66],[4,-62],[30,-36],[40,0],[32,36],[8,62],[-14,68],[-24,58],[-6,34],[2,0],[-6,-30],[-30,-50],[-32,-62]],
  inn(){g.fillStyle='#8a5a2b';g.fillRect(-44,-74,30,15);g.fillRect(-30,56,36,16)},out(){}},
 cytryna:{name:'Cytryna',lock:0,col:'#ffe84a',pts:[[-70,0],[-52,-22],[-28,-44],[0,-50],[28,-44],[52,-22],[70,0],[52,22],[28,44],[0,50],[-28,44],[-52,22]],
  inn(){P(C(-24,-26,14,6,7),'rgba(255,255,255,.45)',{ns:1})},out(){P([[4,-48],[16,-62],[30,-56],[18,-46]],'#57b85a',{lw:3.5})}},
 jablko:{name:'Jabłko',lock:1,col:'#d93a3a',pts:[[0,-44],[22,-56],[50,-44],[62,-12],[54,26],[30,54],[8,56],[0,50],[-8,56],[-30,54],[-54,26],[-62,-12],[-50,-44],[-22,-56]],
  inn(){P(C(-30,-26,12,18,7),'rgba(255,255,255,.25)',{ns:1})},out(){L(0,-46,6,-66,5);P([[8,-62],[24,-76],[38,-66],[22,-56]],'#57b85a',{lw:3.5})}},
 gruszka:{name:'Gruszka',lock:0,col:'#bcd94a',pts:[[0,-66],[18,-60],[24,-38],[30,-14],[50,10],[54,38],[36,60],[0,66],[-36,60],[-54,38],[-50,10],[-30,-14],[-24,-38],[-18,-60]],
  inn(){[[-30,30],[26,40],[0,-40],[-14,50]].forEach(q=>dot(q[0],q[1],2,'#8fae2c'))},out(){L(0,-66,-6,-82,5)}},
 arbuz:{name:'Arbuz',lock:4,col:'#5fbf63',pts:C(0,2,64,58,12),
  inn(){[-44,-15,15,44].forEach(x=>{const z=[];for(let y=-64,i=0;y<=66;y+=13,i++)z.push([x+(i%2?6:-6),y]);P(z,null,{open:1,s:1,lw:9,st:'#2b7a3c'})})},
  out(){P([[0,-56],[4,-70],[16,-72]],null,{open:1,lw:4})}},
 ananas:{name:'Ananas',lock:0,col:'#f2b632',pts:C(0,8,48,58,12),
  inn(){for(let i=-140;i<=140;i+=24){L(i,-70,i+90,80,2.5,'#c98a1b');L(i,-70,i-90,80,2.5,'#c98a1b')}},
  out(){[-.9,.9,-.45,.45,0].forEach(a=>{g.save();g.translate(0,-46);g.rotate(a);P([[-10,0],[0,-46],[10,0]],'#57b85a',{lw:3.5});g.restore()})}},
 grzyb:{name:'Prawdziwek',lock:0,col:'#f3e4c2',pts:[[-62,-10],[-50,-40],[-20,-58],[20,-58],[50,-40],[62,-10],[40,-2],[26,0],[30,40],[20,62],[-20,62],[-30,40],[-26,0],[-40,-2]],
  inn(){P([[-72,-2],[-58,-46],[-22,-68],[22,-68],[58,-46],[72,-2],[34,5],[0,7],[-34,5]],'#9a6230',{ns:1});P([[-72,-2],[-34,5],[0,7],[34,5],[72,-2],[60,-14],[0,-6],[-60,-14]],'rgba(60,25,10,.25)',{ns:1});P(C(-24,-42,15,7,7),'rgba(255,255,255,.28)',{ns:1})},
  out(){P([[-56,-5],[-28,1],[0,3],[28,1],[56,-5]],null,{open:1,lw:3.5})}},
 malina:{name:'Malina',lock:0,col:'#e0407a',pts:[[0,-50],[30,-54],[54,-34],[58,-4],[44,30],[20,54],[0,60],[-20,54],[-44,30],[-58,-4],[-54,-34],[-30,-54]],
  inn(){for(let r=0;r<7;r++)for(let k=0;k<7;k++)P(C(-60+k*20+(r%2?10:0),-56+r*18,11,11,7),'#ee6298',{lw:2,st:'#a82458',a:.6})},
  out(){P(ST(0,-53,6,24,9,.26),'#57b85a',{lw:4})}}
};
function drawBody(id){const B=BASES[id];shaded(B.pts,B.col,B.inn);B.out()}

/* ---------- części ---------- */
const PARTS={},ORDER={oczy:[],buzia:[],twarz:[],rece:[],nogi:[],dod:[]};
function A(cat,id,name,pow,lock,d,x){PARTS[id]=Object.assign({id,cat,name,pow,lock,d},x||{});ORDER[cat].push(id)}
const CATS={
 oczy:{th:[0,-2,26],defs:[[-20,-14],[20,-14],[0,-36],[-38,-30],[38,-30]],m:'f',inv:1},
 buzia:{th:[0,8,44],defs:[[0,26],[0,44]]},
 rece:{th:[26,-44,68],defs:[[50,4],[-50,4],[40,-34],[-40,-34],[48,34],[-48,34]],m:'r',back:1},
 nogi:{th:[30,-6,38],defs:[[22,54],[-22,54],[46,40],[-46,40]],m:'r',back:1},
 twarz:{th:[0,0,24],defs:[[30,-28],[-32,8],[0,4],[-30,-34]]},
 dod:{th:[0,-18,46],defs:[[0,-52]]}};
const eb=(r,pr,px,py,fill)=>{P(C(0,0,r,r*1.08,10),fill||EYE);if(pr)dot(px||2,py||1,pr)};
const brow=()=>P([[-20,-19],[15,-6],[15,-13],[-17,-27]],INK,{s:1,ns:1,a:1});
// oczy
A('oczy','zle','Złe oko',2,0,()=>{eb(14,4,3,2);brow()});
A('oczy','wylup','Wyłupiaste',2,0,()=>{eb(19,2.6,3,1);P([[-16,14],[0,21],[16,14]],null,{open:1,lw:2.5})});
A('oczy','zmruz','Podejrzliwe',2,0,()=>{P([[-15,0],[15,0],[11,10],[0,14],[-11,10]],EYE);dot(3,6,3.5);L(-17,-1,17,-1,6)});
A('oczy','kocie','Kocie',3,0,()=>{eb(15,0,0,0,'#ffe14a');P([[0,-11],[4,0],[0,11],[-4,0]],INK,{ns:1,a:.6})});
A('oczy','zylki','Niewyspane',3,1,()=>{eb(16);L(-14,-5,-6,-2,1.6,'#e0364a');L(-13,6,-5,3,1.6,'#e0364a');L(13,-7,7,-3,1.6,'#e0364a');L(12,8,6,4,1.6,'#e0364a');P(C(2,1,7),'#7fc4e8',{lw:2});dot(2,1,3)});
A('oczy','spirala','Hipnoza',4,3,()=>{eb(17);const z=[];for(let i=0;i<15;i++)z.push([Math.cos(i*.9)*i*1.05,Math.sin(i*.9)*i*1.05]);P(z,null,{open:1,lw:2.5,a:.5})});
A('oczy','cyklop','Oko cyklopa',5,2,()=>{eb(26);P(C(4,2,12),'#6fcf6a',{lw:3});dot(5,2,5);P([[-30,-36],[0,-26],[30,-36],[30,-43],[0,-34],[-30,-43]],INK,{ns:1,s:1})},{th:[0,-4,36]});
A('oczy','laser','Laserowe',8,5,()=>{g.save();g.shadowColor='#ff2a2a';g.shadowBlur=20;eb(14,0,0,0,'#ff2a2a');g.restore();dot(1,1,5,'#ffe94a');brow()});
// buzie
const G=[[-34,-10],[0,-4],[34,-10],[30,12],[14,22],[0,24],[-14,22],[-30,12]];
const TRI=(x,y,w,h)=>P([[x-w,y],[x+w,y],[x,y+h]],EYE,{s:1,lw:2.5});

  let px=ps[i].x,py=ps[i].y;if(meta(D,'m')==='r'){const d=Math.hypot(px,py)||1;px+=px/d*28;py+=py/d*28}
  if(Math.hypot(l[0]-px,l[1]-py)<30||Math.hypot(l[0]-ps[i].x,l[1]-ps[i].y)<22){hit=i;break}}
 if(hit>=0){const pt=ps[hit],p=sp(e);drag={id:pt.id,old:true,idx:hit,x:p[0],y:p[1],sx:p[0],sy:p[1],moved:false,off:0};SFX.pick()}});
addEventListener('pointermove',e=>{if(!drag)return;const p=sp(e);drag.x=p[0];drag.y=p[1];if(!drag.moved&&Math.hypot(p[0]-drag.sx,p[1]-drag.sy)>10){drag.moved=true;if(drag.old){S.fruit.parts.splice(drag.idx,1);$('bin').hidden=false;info()}}});
let lastTap={t:0,i:-1};
function drop(){if(!drag)return;const d=drag;drag=null;$('bin').hidden=true;const l=loc([d.x,d.y-(d.off||0)]),inside=Math.hypot(l[0],l[1])<128;
 if(d.old&&!d.moved){const n=performance.now();if(n-lastTap.t<500&&lastTap.i===d.idx){S.fruit.parts.splice(d.idx,1);lastTap={t:0,i:-1};SFX.swing();pop=1;save();info()}else lastTap={t:n,i:d.idx};return}
 if(!d.moved){const D=PARTS[d.id],defs=D.def?[D.def]:CATS[D.cat].defs,n=count(D.cat),q=defs[n%defs.length];
  let x=q[0],y=q[1];if(D.def&&n%2&&Math.abs(x)>8)x=-x;addPart(d.id,x+(Math.random()-.5)*5,y+(Math.random()-.5)*5)}
 else if(inside)addPart(d.id,l[0],l[1]);
 else{SFX.swing();save();info()}}
addEventListener('pointerup',drop);addEventListener('pointercancel',drop);
$('clr').onclick=()=>{S.fruit.parts=[];SFX.swing();save();info()};
function randomFruit(){const pick=a=>a[Math.random()*a.length|0],jit=k=>(Math.random()-.5)*k,used={};
 S.fruit.base=pick(Object.keys(BASES).filter(id=>BASES[id].lock<=S.wins));S.fruit.parts=[];
 ['oczy','oczy','buzia','rece','rece','nogi','nogi','dod','twarz','rece','dod','twarz','oczy','rece','nogi','dod','twarz','rece','nogi','dod','oczy','rece','twarz','dod','rece','nogi'].slice(0,maxParts()).forEach(cat=>{
  const id=pick(ORDER[cat].filter(i=>PARTS[i].lock<=S.wins)),D=PARTS[id],n=used[cat]=(used[cat]||0)+1,defs=D.def?[D.def]:CATS[cat].defs,q=defs[(n-1)%defs.length];
  let x=q[0],y=q[1];if(D.def&&n%2===0&&Math.abs(x)>8)x=-x;const j=defs.length===1&&n>1?44:n>defs.length?30:8;
  S.fruit.parts.push({id,x:Math.round(x+jit(j)),y:Math.round(y+jit(j))})});pop=1}
let rolling=false;
$('rnd').onclick=()=>{if(rolling)return;rolling=true;let n=0;const go=()=>{randomFruit();SFX.pick();info();if(++n<7)setTimeout(go,90);else{rolling=false;SFX.win();save();renderCreator()}};go()};

/* ---------- walka ---------- */
const CD={cios:.42,kop:1.3,bron:2.4,super:.5}, DUR={cios:.28,kop:.42,bron:.52,super:.8};
const WORDS=['BAM!','ŁUP!','TRACH!','BUM!','PAC!','ZONK!','BĘC!'];
function startFight(pity){
 const n=S.wins,base=ENEMIES[n%ENEMIES.length],tier=Math.floor(n/ENEMIES.length),k=Math.pow(.82,pity||0);
 const E=Object.assign({},base,{name:(tier?'Mega ':'')+base.name,size:base.size+tier*.08});
 const pw=power(),pm=100+pw*.4,em=(130+85*n)*(E.boss?1.4:1)*k;
 F={E,n,pity:pity||0,php:pm,pmax:pm,ehp:em,emax:em,dmg:Math.min(18,6+n)*k,teleD:Math.max(.5,.85-n*.03),teleT:1,gap:Math.max(.8,1.5-n*.05),
  arms:count('rece'),legs:count('nogi'),wp:S.fruit.parts.reduce((s,p)=>s+(PARTS[p.id].wp?PARTS[p.id].pow:0),0),
  atk:null,cd:{cios:0,kop:0,bron:0,super:0},sup:0,est:'idle',et:1,ep:0,edone:false,floats:[],parts:[],shake:0,phurt:0,ehurt:0,over:null,ot:0,mult:1+pw/90,
  intro:1.9,drops:[],dropT:9,combo:0,best:0,rage:false,big:false,nAtk:0,stop:0,stars:0};
 $('hpPn').textContent=fname();$('hpEn').textContent=(E.boss?'👑 ':'')+E.name;$('lvl').textContent='Poziom '+(n+1)+(E.boss?' – boss':'');
 $('bB').lastChild.textContent=F.wp?'Broń':'Główka';$('bB').firstChild.textContent=F.wp?'🪓':'🤕';
 mode='fight';show('fight');song='fight';bars();
}
function act(type){audio();if(!F||F.over||F.atk||F.intro>0)return;if(type==='super'&&F.sup<100){SFX.nope();return}if(F.cd[type]>0)return;
 F.atk={type,p:0,hit:false};F.cd[type]=CD[type];if(type==='super'){F.sup=0;SFX.sup()}else SFX.swing()}
function floatTxt(txt,x,y,col,size,b){F.floats.push({txt,x,y,col,size:size||40,life:1,rot:(Math.random()-.5)*.5,b})}
function burst(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*7,v=120+Math.random()*220;F.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,life:1,r:6+Math.random()*7,col:['#ffd23f','#fff','#ff8a2a'][i%3]})}}
function landHit(type){
 let d,big=false;
 if(type==='cios')d=2.5+F.arms*.4;else if(type==='kop')d=4.5+F.legs*.7;
 else if(type==='bron'){d=5+F.wp*.28;big=true}else{d=24;big=true}
 F.combo++;F.best=Math.max(F.best,F.combo);
 d*=F.mult*(1+Math.min(F.combo,10)*.05);let word=null;
 if(F.est==='guard'){if(big){F.est='stun';F.et=.9;word='PRZEBITE!'}else{d*=.2;word='BLOK!';F.combo=0}}
 F.ehp=Math.max(0,F.ehp-d);F.ehurt=1;F.shake=big?12:5;SFX.hit(big);if(big&&!RM)F.stop=.07;
 F.sup=Math.min(100,F.sup+(type==='cios'?8:type==='kop'?12:type==='bron'?16:0));
 floatTxt(word||(type==='super'?'SUPER!':WORDS[Math.random()*WORDS.length|0]),450+Math.random()*60,160+Math.random()*60,word==='BLOK!'?'#9fb7d9':big?'#e8404f':'#ffd23f',big?58:42,word!=='BLOK!');
 burst(480,250,big?16:7);
 if((type==='kop'||type==='super')&&F.est==='tele'){if(F.et<.5||type==='super'){F.est='stun';F.et=F.big?1.5:1;floatTxt('KONTRA!',400,125,'#6fcf6a',48);F.sup=Math.min(100,F.sup+15)}else floatTxt('ZA WCZEŚNIE!',400,125,'#fff',34)}
 if(!F.rage&&F.ehp>0&&F.ehp<F.emax*.35){F.rage=true;F.gap*=.8;floatTxt('WŚCIEKŁY!',560,120,'#e8404f',44)}
 if(F.ehp<=0){const r=F.php/F.pmax;F.stars=r>.66?3:r>.33?2:1;S.stars=(S.stars||0)+F.stars;
  F.over='win';F.ot=0;F.est='ko';S.wins++;save();SFX.win();song=null;burst(540,250,30)}
}
function bars(){const f=F;$('hpPf').style.width=(f.php/f.pmax*100)+'%';$('hpEf').style.width=(f.ehp/f.emax*100)+'%';
 [['bC','cios'],['bK','kop'],['bB','bron']].forEach(b=>$(b[0]).style.setProperty('--cd',f.cd[b[1]]/CD[b[1]]));
 $('bS').style.setProperty('--cd',1-f.sup/100);$('bS').classList.toggle('ready',f.sup>=100)}
function eIdle(f,t){if(f.n>=1&&!f.wg&&Math.random()<.3){f.est='guard';f.et=1.3;f.wg=true}else{f.est='idle';f.et=t;f.wg=false}}
function updateFight(dt){
 const f=F;if(!f)return;
 if(f.intro>0){f.intro-=dt;return}
 if(f.stop>0){f.stop-=dt;return}
 for(const k in f.cd)f.cd[k]=Math.max(0,f.cd[k]-dt);
 f.phurt=Math.max(0,f.phurt-dt*3);f.ehurt=Math.max(0,f.ehurt-dt*4);f.shake=Math.max(0,f.shake-dt*40);
 if(f.atk){f.atk.p+=dt/DUR[f.atk.type];if(f.atk.p>=.5&&!f.atk.hit&&!f.over){f.atk.hit=true;landHit(f.atk.type)}if(f.atk&&f.atk.p>=1)f.atk=null}
 if(!f.over){
  if(f.est==='idle'){f.et-=dt;if(f.et<=0){f.est='tele';f.big=!!f.E.boss&&(f.nAtk++%2===1);f.teleT=f.et=f.teleD*(f.big?1.6:1)}}
  else if(f.est==='tele'){f.et-=dt;if(f.et<=0){f.est='strike';f.ep=0;f.edone=false}}
  else if(f.est==='strike'){f.ep+=dt/.4;
   if(f.ep>=.5&&!f.edone){f.edone=true;f.php=Math.max(0,f.php-f.dmg*(f.big?1.8:1));f.phurt=1;f.shake=f.big?14:8;f.combo=0;SFX.ouch();floatTxt(f.big?'ŁUBUDU!':'AUĆ!',250,130,'#fff',f.big?52:40);
    if(f.php<=0){f.over='lose';f.ot=0;SFX.lose();song=null}}
   if(f.ep>=1){if(f.n>=1&&!f.dbl&&Math.random()<.3){f.dbl=true;f.big=false;f.est='tele';f.teleT=f.et=.45}else{f.dbl=false;eIdle(f,f.gap+Math.random()*.5)}}}
  else if(f.est==='stun'){f.et-=dt;if(f.et<=0){f.est='idle';f.et=.8}}
  else if(f.est==='guard'){f.et-=dt;if(f.et<=0){f.est='idle';f.et=f.gap*.5}}
  f.dropT-=dt;if(f.dropT<=0&&f.drops.length<2){f.dropT=9+Math.random()*4;f.drops.push({x:340+Math.random()*130,y:-30,type:'bolt',rest:0})}
  f.drops.forEach(d=>{if(d.y<322)d.y+=dt*85;else d.rest+=dt});f.drops=f.drops.filter(d=>d.rest<3.2);
 }else{f.ot+=dt;if(f.ot>1.3&&!f.shown){f.shown=true;showResult()}}
 f.floats.forEach(o=>{o.life-=dt*1.3;o.y-=dt*50});f.floats=f.floats.filter(o=>o.life>0);
 f.parts.forEach(o=>{o.life-=dt*1.6;o.x+=o.vx*dt;o.y+=o.vy*dt;o.vy+=500*dt});f.parts=f.parts.filter(o=>o.life>0);
 bars();
}
function drawFight(){
 const f=F;g.save();if(f.shake&&!RM)g.translate((Math.random()-.5)*f.shake,(Math.random()-.5)*f.shake);
 drawBg(f.E.bg,T);pen();
 P(C(250,372,72,11),'rgba(70,40,15,.18)',{ns:1});if(f.over!=='win')P(C(555,372,70*f.E.size,11),'rgba(70,40,15,.18)',{ns:1});
 drawEnemy(f.E,555,275,1.1,{t:T,tele:f.est==='tele'?Math.min(1,(f.teleT-f.et)/.25):0,strike:f.est==='strike'?f.ep:0,hurt:f.ehurt,stun:f.est==='stun',guard:f.est==='guard',hot:f.est==='tele'&&f.et<.5,rage:f.rage,big:f.big,ko:f.over==='win'?Math.min(1,f.ot/1.1):0});
 drawFruit(S.fruit,250,268,.95,{t:T,atk:f.atk,hurt:f.phurt,evo:evo(),dizzy:f.over==='lose'});
 pen();SC=9300;if(!f.over)f.drops.forEach(d=>{if(d.rest>2.2&&Math.floor(T*10)%2)return;g.save();g.translate(d.x,d.y+Math.sin(T*5+d.x)*4);
  P(C(0,0,31,31,12),'rgba(255,255,255,.6)',{lw:3});
  if(d.type==='heart')P([[0,15],[-17,-2],[-12,-15],[0,-7],[12,-15],[17,-2]],'#e8404f',{lw:3});
  else if(d.type==='bolt')P([[4,-19],[-11,2],[-1,2],[-5,19],[11,-4],[1,-4]],'#ffd23f',{s:1,lw:3});
  else P(ST(0,0,5,18,8,-1.57),'#ffd23f',{s:1,lw:3});g.restore()});
 pen();SC=9500;f.parts.forEach(o=>{g.globalAlpha=Math.max(0,o.life);P(ST(o.x,o.y,5,o.r,o.r*.45,o.life*6),o.col,{lw:2,s:1,a:.5})});g.globalAlpha=1;
 f.floats.forEach((o,i)=>{g.globalAlpha=Math.min(1,o.life*2);if(o.b){pen();SC=9600+i*30;P(ST(o.x,o.y,9,o.size*1.45,o.size*.9,o.rot),'#fffdf2',{s:1,lw:3,a:2})}comic(o.txt,o.x,o.y,o.size*(1+(1-o.life)*.3),o.col,o.rot)});g.globalAlpha=1;
 if(f.combo>=3&&!f.over)comic('COMBO x'+f.combo,400,98,28+Math.min(f.combo,10)*2,'#ffd23f',-.05);
 if(f.intro>0){g.globalAlpha=Math.max(0,Math.min(1,f.intro*3,(1.9-f.intro)*6));pen();SC=9800;P(R(-20,150,840,135),'#fffaf0',{s:1,lw:5});
  comic('Poziom '+(f.n+1),400,180,32,'#fff');comic(f.E.name+(f.E.boss?' – BOSS!':''),400,236,f.E.name.length>16?42:54,f.E.boss?'#e8404f':'#ffd23f',-.03);g.globalAlpha=1}
 g.restore();
}
function showResult(){
 const win=F.over==='win';let h;
 if(win){const news=[];for(const id in PARTS)if(PARTS[id].lock===S.wins)news.push(PARTS[id].name);for(const id in BASES)if(BASES[id].lock===S.wins)news.push(BASES[id].name);
  const ev=S.wins%4===0&&S.wins<=12;
  h='<h2>Wygrana!</h2><p style="font-size:38px;line-height:1.1">'+'⭐'.repeat(F.stars)+'☆'.repeat(3-F.stars)+'</p>'+
   '<p>'+F.E.name+' ucieka, gdzie pieprz rośnie'+(F.best>=3?'. Najlepsze combo: x'+F.best:'')+'</p>'+
   (F.E.boss?'<p class="new">👑 Boss pokonany!</p>':'')+
   (ev?'<p class="new">⚡ Ewolucja! Twój owoc urósł w siłę</p>':'')+
   '<p class="new">'+(maxParts()<26?'+1 miejsce na części. ':'')+(news.length?'Nowe: '+news.join(', '):'')+'</p>'+
   '<p>'+strip()+'</p>'+
   '<div><button class="big alt" id="rA">Ulepsz owoca</button><button class="big" id="rB">Następna walka</button></div>';
 }else h='<h2>Ojej!</h2><p>'+F.E.name+' tym razem był szybszy.<br>Teraz jest zmęczony. Dołóż części i spróbuj jeszcze raz!</p>'+
   '<div><button class="big alt" id="rA">Ulepsz owoca</button><button class="big" id="rB">Jeszcze raz</button></div>';

let last=performance.now();
function frame(nowT){
 const dt=Math.min(.05,(nowT-last)/1000);last=nowT;T+=dt;BO=1;SC=0;g=c;c.clearRect(0,0,800,450);
 if(mode==='title'){drawBg('las',T);drawFruit(S.fruit.parts.length?S.fruit:DEMO,180,300,.95,{t:T,evo:evo()});drawEnemy(ENEMIES[1],630,300,1,{t:T})}
 else if(mode==='creator'){pop=Math.max(0,pop-dt*4);if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').hidden=true}
  drawBg('papier',T);drawFruit(S.fruit,FX,FY,FS*(1+pop*.1),{t:0,evo:evo()});
  if(drag&&drag.moved){drag.off=Math.min(62,drag.off+dt*450);const l=loc([drag.x,drag.y-drag.off]);g.save();pen();g.translate(FX,FY);g.scale(FS*1.08,FS*1.08);g.globalAlpha=Math.hypot(l[0],l[1])<128?1:.7;SC=9000;drawPart({id:drag.id,x:l[0]/1.08,y:l[1]/1.08},{t:T});g.restore()}}
 else{updateFight(dt);drawFight()}

}
function fit(){const w=$('fit'),cs=getComputedStyle(w),W=w.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),H=w.clientHeight;
 const s=Math.min(W/800,H/450);$('stage').style.transform='translate(-50%,-50%) scale('+s+')'}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));fit();
const FSE=document.documentElement,canFS=!!((FSE.requestFullscreen||FSE.webkitRequestFullscreen)&&(document.fullscreenEnabled||document.webkitFullscreenEnabled));
function goFS(){try{if(document.fullscreenElement||document.webkitFullscreenElement)return;const r=FSE.requestFullscreen||FSE.webkitRequestFullscreen,p=r.call(FSE);
 if(p&&p.then)p.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}setTimeout(fit,300)}).catch(()=>{})}catch(e){}}
if(canFS){$('fs').hidden=false;$('fs').onclick=goFS}
$('play').onclick=()=>{audio();if(canFS)goFS();SFX.pick();openCreator()};
$('go').onclick=()=>{audio();SFX.pick();startFight(0)};
$('quit').onclick=()=>openCreator();
$('mute').onclick=$('mute2').onclick=toggleMute;
function grab(d){SFX.pick();burst(d.x,d.y,10);
 if(d.type==='heart'){F.php=Math.min(F.pmax,F.php+F.pmax*.25);floatTxt('+ŻYCIE!',d.x,d.y-34,'#6fcf6a',40)}
 else if(d.type==='bolt'){F.sup=100;floatTxt('SUPER GOTOWY!',d.x,d.y-34,'#a878e8',38)}
 else{F.ehp=Math.max(1,F.ehp-F.emax*.12);F.ehurt=1;F.shake=8;SFX.hit(true);floatTxt('BONUS BAM!',d.x,d.y-34,'#ffd23f',40)}}
$('fight').addEventListener('pointerdown',e=>{if(!F||F.over||F.intro>0||e.target.closest('button'))return;const p=sp(e);
 for(let i=F.drops.length-1;i>=0;i--){const d=F.drops[i];if(Math.hypot(p[0]-d.x,p[1]-d.y)<50){F.drops.splice(i,1);grab(d);break}}});
[['bC','cios'],['bK','kop'],['bB','bron'],['bS','super']].forEach(b=>$(b[0]).addEventListener('pointerdown',e=>{e.preventDefault();act(b[1])}));
document.addEventListener('pointerdown',audio,{once:true});
requestAnimationFrame(frame);
</script>
