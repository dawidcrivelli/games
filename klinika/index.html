<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#3a2412">
<title>Klinika Zoo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦒</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Bangers&display=swap">
<link rel="stylesheet" href="../lib/komiks.bryki-klinika.css">
<style>
:root{--panel:#fff3d6;--ink:#3a2412;--edge:#1e120a;--gold:#ffc93c;--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none !important}
html,body{height:100%;margin:0;overflow:hidden;background:#fff0c8;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:"Baloo 2",ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;color:var(--ink);touch-action:none;pointer-events:auto;padding:0;position:relative;overflow:hidden}
.ov{position:fixed;inset:0;pointer-events:none;font-weight:800}
.rb{width:52px;height:52px;border-radius:50%;background:var(--panel);box-shadow:0 4px 0 var(--edge);font-size:24px;display:grid;place-items:center}
/* --- gra --- */
#top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:calc(8px + var(--st)) calc(10px + var(--sr)) 0 calc(10px + var(--sl))}
#zad{flex:1;display:flex;justify-content:center;gap:12px}
#zad b{width:58px;height:58px;border-radius:18px;background:rgba(255,243,214,.85);box-shadow:0 4px 0 var(--edge);display:grid;place-items:center;font-size:32px;position:relative;transition:transform .2s}
#zad b.teraz{background:var(--gold);animation:pulse .5s infinite alternate}
#zad b.ok::after{content:"✅";position:absolute;right:-8px;bottom:-8px;font-size:24px}
#zad b.ok{opacity:.75}
#napis{position:absolute;left:50%;top:calc(76px + var(--st));transform:translate(-50%,-20px);opacity:0;transition:.25s;background:rgba(255,243,214,.95);border-radius:20px;padding:6px 18px;font-size:1.25rem;box-shadow:0 4px 0 var(--edge);max-width:80vw;text-align:center}
#napis.on{opacity:1;transform:translate(-50%,0)}
#bRtg{position:absolute;right:calc(18px + var(--sr));bottom:calc(18px + var(--sb));width:110px;height:110px;border-radius:50%;font-size:56px;background:#3ad1ff;box-shadow:0 6px 0 #146b8a,0 0 0 6px #fff;animation:pulse .45s infinite alternate}
#bRtg:active{transform:translateY(4px)}
#paleta{position:absolute;right:calc(14px + var(--sr));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;pointer-events:auto}
#paleta button{width:66px;height:66px;border-radius:50%;box-shadow:0 5px 0 var(--edge),inset 0 -6px 0 rgba(0,0,0,.18);border:4px solid #fff;animation:pop .3s backwards}
@keyframes pop{from{transform:scale(0)}}
.znak{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:#ff3a4a;color:#fff;font:400 34px/44px Bangers,Impact,sans-serif;text-align:center;box-shadow:0 0 0 4px #fff,0 4px 0 4px var(--edge);animation:znak .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes znak{from{transform:translate(-50%,-50%) scale(0)}}
#lupa{position:absolute;width:30px;height:110px;border-radius:15px;background:linear-gradient(90deg,#c46a2a,#e88a40 50%,#a8521e);box-shadow:0 0 0 3px var(--edge);transform-origin:50% 0;pointer-events:none}
#raczka{position:absolute;font-size:56px;transform:translate(-30%,-10%);pointer-events:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35));transition:opacity .3s}
/* --- menu: karta po prawej, pacjenci w poczekalni po lewej --- */
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:flex-end;padding:calc(10px + var(--st)) calc(14px + var(--sr)) calc(10px + var(--sb)) 12px;overflow:auto}
.card{background:var(--card);border-radius:28px;padding:14px 18px 18px;width:min(430px,100%);box-shadow:0 7px 0 var(--plate-edge),0 18px 40px var(--shade);text-align:center}
.card h1{font-size:2.3rem;line-height:1;margin:0 0 4px;font-weight:800;color:var(--red);text-shadow:0 3px 0 var(--plate-edge)}
.card .sub{margin:0 0 10px;font-size:1.05rem;font-weight:700}
#pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#pick .btn{flex-direction:column;height:118px;gap:2px;font-size:1rem}
#pick .btn .ico{font-size:3.4rem}
#pick .btn .gw{font-size:.95rem;letter-spacing:-2px;min-height:1.1em}
#bSnd{position:fixed;left:calc(12px + var(--sl));top:calc(10px + var(--st));width:56px;height:48px;font-size:1.4rem}
#end .duzy{font-size:96px;line-height:1;filter:drop-shadow(0 5px 0 var(--edge));animation:hop .5s infinite alternate}
@keyframes hop{to{transform:translateY(-14px) rotate(6deg)}}
#end .nakl{font-size:52px;letter-spacing:4px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="ov" hidden>
  <div id="znaki"></div>
  <div id="lupa" hidden></div>
  <div id="fx"></div>
  <div id="top"><button id="bDom" class="rb" aria-label="Menu">🏠</button><div id="zad"></div><button id="bSnd2" class="rb" aria-label="Dźwięk">🔊</button></div>
  <button id="bRtg" hidden aria-label="Rentgen">🔍</button>
  <div id="paleta" hidden></div>
  <div id="raczka" hidden>👆</div>
  <div id="napis"></div>
</div>
<div id="menu">
  <div class="card">
    <h1>Klinika Zoo</h1><p class="sub">Kto dziś przyszedł do doktora?</p>
    <div id="pick"></div>
    <button class="btn" id="bGo" hidden>Leczymy!</button>
  </div>
  <button class="btn" id="bSnd" aria-label="Dźwięk">🔊</button>
</div>
<div id="end" class="box" hidden><div class="in"><div class="duzy" id="endIc">🦒</div><div class="nakl" id="endNakl">⭐</div><div class="row"><button id="bNext" class="btn go"><span class="ico">➡️</span>Następny pacjent</button><button id="bHome" class="btn"><span class="ico">🏠</span>Menu</button></div></div></div>
<div id="confetti"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../lib/komiks.bryki-klinika.js"></script>
<script src="../lib/dzwiek.bryki-klinika.js"></script>
<script src="../models/anatomia.klinika.js"></script>
<script src="../models/pacjenci.klinika.js"></script>
<script src="../models/gabinet.klinika.js"></script>
<script src="dzwieki.js"></script>
<script src="game.js"></script>
<script src="../lib/obrot.ciuchcia-taxi-zniwa-pralnia-arka-rafa-piraci-bryki-klinika.js"></script>
<script>obrotInit()</script>
</body>
</html>
