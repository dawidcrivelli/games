<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Łakome Zwierzaki</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥕</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Bangers&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lib/ui/comic.css">
<style>
:root{--ink:#3b2a17;--edge:#7a4a1c;--font:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;--sky:#9fd6f2;--plank:#e8b56a;--plank-d:#9a6630;--leaf:#4fae3a;
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);font-family:var(--font);color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:4px solid #fff36a;outline-offset:2px}

/* ---------- pasek u góry: ziarenka · karty roślin · kosz, słońce, pauza ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
#bar{position:absolute;left:calc(6px + var(--sl));right:calc(6px + var(--sr));top:calc(4px + var(--st));display:flex;align-items:flex-start;gap:8px;pointer-events:none}
#bar>*{pointer-events:auto}
.plank{background:linear-gradient(#f2c77e,var(--plank) 55%,#d99a4c);border-radius:16px;box-shadow:0 4px 0 var(--plank-d),0 7px 12px rgba(60,35,10,.3);border:2px solid #fff1cf}
#seeds{display:flex;align-items:center;gap:2px;padding:2px 10px 2px 4px;height:clamp(56px,13vh,76px);min-width:96px}
#seeds img{width:clamp(44px,10vh,60px);height:auto}
#seeds b{font:400 clamp(30px,7.5vh,44px)/1 Bangers,var(--font);color:#fff;-webkit-text-stroke:2.5px #3b2a17;paint-order:stroke fill;letter-spacing:1px;min-width:1.2em;text-align:center}
#seeds.bump{animation:bump .35s}
#seeds.no{animation:shake .4s}
@keyframes bump{50%{transform:scale(1.18)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
#cards{display:flex;gap:7px;padding:2px;flex:1 1 auto;min-width:0;align-items:flex-start}
.grp{position:relative;display:flex;gap:4px;padding:3px 4px 4px 4px;border-radius:16px;min-width:0}
.grp .badge{position:absolute;left:-6px;top:-7px;width:24px;height:24px;z-index:2;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.grp .badge svg{width:100%;height:100%}
.g-bean{background:linear-gradient(#d9a8f0,#a663d0);box-shadow:0 3px 0 #6a2a90}
.g-crop{background:linear-gradient(#a8e08a,#5fae3a);box-shadow:0 3px 0 #3a7a22}
.g-guard{background:linear-gradient(#ffb09a,#e0574a);box-shadow:0 3px 0 #9c2a18}
.c-bean{background:linear-gradient(#fff,#f3e6fb)}.c-crop{background:linear-gradient(#fff,#eaf7df)}.c-guard{background:linear-gradient(#fff,#fde6df)}
.card{position:relative;flex:0 1 auto;min-width:44px;width:clamp(56px,12.5vh,76px);height:clamp(62px,14.5vh,88px);border-radius:14px;background:linear-gradient(#fffaf0,#f3e2bf);
  box-shadow:0 4px 0 #b98a4a,0 6px 10px rgba(60,35,10,.3);border:2px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:hidden;transition:transform .1s}
.card img{width:92%;height:auto;margin-top:-2px;pointer-events:none}
.card .cost{position:absolute;bottom:3px;left:0;right:0;display:flex;justify-content:center;gap:3px}
.card .cost i{width:10px;height:13px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#3a2c26;box-shadow:inset 2px 0 0 #f4efe0}
.card.sel{transform:translateY(-3px) scale(1.08);border-color:#fff36a;box-shadow:0 0 0 4px #ffd23f,0 6px 0 #b07a12,0 10px 16px rgba(60,35,10,.35);background:linear-gradient(#fffbe0,#ffe58a)}
.card.poor img{filter:grayscale(1) brightness(.85);opacity:.6}
.card.poor .cost i{background:#c33}
.card .cd{position:absolute;left:0;right:0;bottom:0;height:calc(var(--cd,0)*100%);background:rgba(60,40,20,.45);pointer-events:none}
.card.new{animation:newc 1.2s 2}
@keyframes newc{0%,100%{transform:scale(1)}30%{transform:scale(1.25) rotate(-6deg);box-shadow:0 0 0 6px #7dff6a,0 6px 0 #b07a12}60%{transform:scale(1.1) rotate(5deg)}}
#right{display:flex;gap:8px;align-items:flex-start;margin-left:auto}
#basket{position:relative;display:flex;align-items:center;gap:2px;padding:2px 10px 2px 4px;height:clamp(56px,13vh,76px)}
#basket img{width:clamp(48px,11vh,64px);height:auto}
#basket b{font:400 clamp(28px,7vh,40px)/1 Bangers,var(--font);color:#fff;-webkit-text-stroke:2.5px #3b2a17;paint-order:stroke fill;min-width:1.3em;text-align:center}
#stars{position:absolute;left:4px;right:4px;bottom:-15px;display:flex;justify-content:center;gap:2px}
#stars svg{width:22px;height:22px}
#basket.bump{animation:bump .35s}
#day{position:absolute;left:calc(14% + var(--sl));right:calc(14% + var(--sr));bottom:calc(6px + var(--sb));height:8px;border-radius:5px;background:rgba(40,25,10,.35);pointer-events:none}
#dayFill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,#ffc8b0,#ffd23f 40%,#ffa53a 75%,#ff7a50)}
#daySun{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff7b0,#ffd23f 60%,#f0a020);border:2px solid #3b2a17;box-shadow:0 0 10px #ffe680}
#daySun.late{background:radial-gradient(circle at 40% 35%,#ffd0a0,#ff7a50 60%,#c04020)}
#bPause{width:clamp(48px,11vh,60px);height:clamp(48px,11vh,60px);display:grid;place-items:center}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fly{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;transition:transform .7s cubic-bezier(.5,-0.4,.7,1),opacity .7s;pointer-events:none;will-change:transform}
#finger{position:absolute;width:74px;height:74px;margin:-6px 0 0 -18px;pointer-events:none;animation:tapf .9s infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35));z-index:5}
@keyframes tapf{0%,100%{transform:translate(0,14px) scale(1)}50%{transform:translate(0,0) scale(.9)}}
#banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font:400 clamp(40px,11vh,72px)/1 Bangers,var(--font);color:#ffd23f;-webkit-text-stroke:4px #3b2a17;paint-order:stroke fill;letter-spacing:3px;white-space:nowrap;text-shadow:0 6px 0 #3b2a17;animation:ban 2.4s forwards;pointer-events:none}
@keyframes ban{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}15%{transform:translate(-50%,-50%) scale(1.15);opacity:1}25%,80%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}

/* ---------- menu, pauza, koniec dnia ---------- */
.scr{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,rgba(255,250,230,.25),rgba(40,25,10,.55))}
.scr .in{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2.5vh,18px);padding:16px}
.title{font:400 clamp(44px,13vh,92px)/.95 Bangers,var(--font);letter-spacing:3px;color:#ffd23f;-webkit-text-stroke:5px #3b2a17;paint-order:stroke fill;text-shadow:0 7px 0 #3b2a17;text-align:center}
.crew{display:flex;gap:4px;align-items:flex-end;justify-content:center}
.crew img{height:clamp(70px,22vh,150px);width:auto;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.big{width:clamp(96px,24vh,140px);height:clamp(96px,24vh,140px);border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff7a5a,#d9432a 60%,#9c2a18);box-shadow:0 7px 0 #7a1e10,0 12px 20px rgba(0,0,0,.35);display:grid;place-items:center;border:4px solid #fff3d6}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 #7a1e10}
.big svg{width:52%;height:52%}
.row{display:flex;gap:16px;justify-content:center;align-items:center}
.rb{width:clamp(64px,15vh,84px);height:clamp(64px,15vh,84px);border-radius:22px;background:linear-gradient(#fffaf0,#f3e2bf);box-shadow:0 5px 0 #b98a4a,0 9px 14px rgba(60,35,10,.3);display:grid;place-items:center;border:3px solid #fff}
.rb:active{transform:translateY(4px);box-shadow:0 1px 0 #b98a4a}
.rb svg{width:56%;height:56%}
#endStars{display:flex;gap:10px}
#endStars svg{width:clamp(60px,16vh,100px);height:auto}
#endStars svg.on{animation:pop .5s backwards}
#endStars svg:nth-child(2).on{animation-delay:.35s}#endStars svg:nth-child(3).on{animation-delay:.7s}
@keyframes pop{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
#endBasket{display:flex;align-items:center;gap:8px}
#endBasket img{height:clamp(60px,16vh,100px)}
#endBasket b{font:400 clamp(44px,12vh,72px)/1 Bangers,var(--font);color:#fff;-webkit-text-stroke:4px #3b2a17;paint-order:stroke fill}
/* dymki z lib/ui/comic.css — mniejsze na telefonie */
.bub b{font-size:clamp(18px,5vh,28px)}.bub i{inset:-16px -22px}.bub.small b{font-size:clamp(14px,4vh,20px)}.bub.small i{inset:-10px -14px}.bub.big b{font-size:clamp(22px,6.5vh,34px)}
#err{position:fixed;inset:0;display:none;place-items:center;background:#9fd6f2;font-size:20px;text-align:center;padding:20px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" hidden>
  <div id="bar">
    <div id="seeds" class="plank" aria-label="Ziarenka"><img id="seedIco" alt=""><b id="seedN">0</b></div>
    <div id="cards"></div>
    <div id="right">
      <div id="basket" class="plank" aria-label="Kosz"><img id="basketIco" alt=""><b id="basketN">0</b><div id="stars"></div></div>
      <button id="bPause" class="plank" aria-label="Pauza"><svg viewBox="0 0 24 24" width="30" height="30"><rect x="5" y="4" width="5" height="16" rx="1.5" fill="#fff" stroke="#3b2a17" stroke-width="1.6"/><rect x="14" y="4" width="5" height="16" rx="1.5" fill="#fff" stroke="#3b2a17" stroke-width="1.6"/></svg></button>
    </div>
  </div>
  <div id="day" aria-label="Pora dnia"><i id="dayFill"></i><b id="daySun"></b></div>
  <div id="fx"></div>
</div>
<div id="menu" class="scr">
  <div class="in">
    <div class="title">Łakome<br>Zwierzaki</div>
    <div class="crew" id="crew"></div>
    <div class="row">
      <button class="big" id="bGo" aria-label="Graj"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="#fff" stroke="#7a1e10" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
      <button class="rb" id="bSnd" aria-label="Dźwięk"></button>
    </div>
  </div>
</div>
<div id="pause" class="scr" hidden>
  <div class="in">
    <div class="row">
      <button class="big" id="bResume" aria-label="Graj dalej"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="#fff" stroke="#7a1e10" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="row">
      <button class="rb" id="bRestart" aria-label="Od nowa"></button>
      <button class="rb" id="bSnd2" aria-label="Dźwięk"></button>
      <button class="rb" id="bHome" aria-label="Wszystkie gry"></button>
    </div>
  </div>
</div>
<div id="end" class="scr" hidden>
  <div class="in">
    <div class="title" style="font-size:clamp(36px,10vh,64px)">Koniec dnia!</div>
    <div id="endStars"></div>
    <div id="endBasket"><img id="endBasketIco" alt=""><b id="endN">0</b></div>
    <div class="row">
      <button class="big" id="bAgain" aria-label="Jeszcze raz"></button>
      <button class="rb" id="bHome2" aria-label="Wszystkie gry"></button>
    </div>
  </div>
</div>
<div id="err">Ta gra potrzebuje przeglądarki z grafiką 3D (WebGL).</div>
<div id="confetti"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../lib/3d/three.js"></script>
<script src="../lib/common/math.js"></script>
<script src="../lib/common/dom.js"></script>
<script src="../lib/common/random.js"></script>
<script src="../lib/3d/shapes.js"></script>
<script src="../lib/3d/sky.js"></script>
<script src="../lib/3d/weather.js"></script>
<script src="../lib/3d/particles.js"></script>
<script src="../lib/3d/view.js"></script>
<script src="../lib/3d/icons.js"></script>
<script src="../lib/audio/synth.js"></script>
<script src="../lib/audio/critters.js"></script>
<script src="../lib/audio/speech.js"></script>
<script src="../lib/ui/comic.js"></script>
<script src="../models/buildings.js"></script>
<script src="../models/people.js"></script>
<script src="../models/vehicle-parts.js"></script>
<script src="../models/tractor.js"></script>
<script src="../models/grass.js"></script>
<script src="../models/animals.js"></script>
<script src="../models/farm-animals.js"></script>
<script src="../models/forest-animals.js"></script>
<script src="../models/farmer.js"></script>
<script src="../models/plants.js"></script>
<script src="day.js"></script>
<script src="game.js"></script>
<script src="../lib/common/screen.js"></script>
<script>obrotInit()</script>
</body>
</html>
