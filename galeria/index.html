<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galeria modeli 3D</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐘</text></svg>">
<style>
:root{--bg:#9fe3f5;--card:#fdfcf7;--ink:#173a5e;--edge:#0f2a47;--acc:#ffd23f}
@media (prefers-color-scheme:dark){:root{--bg:#0f2a47;--card:#213f63;--ink:#fdfcf7;--edge:#06121f}}
body{margin:0;background:var(--bg);color:var(--ink);font:700 16px/1.3 ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;padding:12px calc(12px + env(safe-area-inset-right)) 40px calc(12px + env(safe-area-inset-left))}
#gl{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
header a{color:inherit;text-decoration:none;font-size:26px}
h1{margin:0 8px 0 0;font-size:26px}
nav button,#x{font:inherit;border:0;border-radius:999px;padding:6px 14px;background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--edge);cursor:pointer}
nav button.on{background:var(--acc);color:#173a5e}
#st{font-weight:500;opacity:.75;font-size:14px}
main{display:flex;flex-wrap:wrap;gap:4px 22px}
h3{margin:14px 0 6px;font-size:19px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.card{width:200px;background:var(--card);border-radius:14px;box-shadow:0 4px 0 var(--edge);cursor:pointer;overflow:hidden}
.card .v{height:170px;background:radial-gradient(circle at 50% 40%,#fff 0,#dfeef5 70%)}
@media (prefers-color-scheme:dark){.card .v,#big .v{background:radial-gradient(circle at 50% 40%,#3c5f86 0,#1a3350 70%)}}
.card p{margin:6px 10px 8px;font-size:14px}
.card small,#big small{display:block;font-weight:500;opacity:.7;font-size:12px}
.card.err .v{display:grid;place-items:center;font-size:12px;padding:8px;color:#b23a2e}
#big{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;padding:12px;gap:8px}
#big .v{flex:1;border-radius:14px;background:radial-gradient(circle at 50% 40%,#fff 0,#dfeef5 70%);touch-action:none;cursor:grab}
#big header{margin:0;position:relative;z-index:2}
[hidden]{display:none !important}
.snd{width:250px;background:var(--card);border-radius:14px;box-shadow:0 4px 0 var(--edge);padding:10px 12px}
.snd .e{font-size:34px;line-height:1}.snd p{margin:4px 0 8px}.snd small{display:block;font-weight:500;opacity:.7;font-size:12px;word-break:break-word}
.snd .b{display:flex;gap:8px;flex-wrap:wrap}.snd button{font:inherit;border:0;border-radius:12px;padding:10px 12px;background:var(--acc);color:#173a5e;box-shadow:0 3px 0 var(--edge);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.snd button.on{transform:translateY(3px);box-shadow:0 0 0 var(--edge)}.snd meter{width:100%;height:10px;margin-top:8px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<header><a href="../" aria-label="Gry">🎮</a><h1>Galeria 3D</h1><nav id="tabs"></nav><span id="st"></span></header>
<main id="list"></main>
<div id="big" hidden><header><button id="x">✖</button><span id="info"></span></header><div class="v" id="bigV"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="modele.js"></script>
<!-- dźwięki: te same biblioteki co w grach -->
<script>const AU = {}, S = { muted: false }; let seed = 7;</script>
<script src="../lib/common/math.js"></script>
<script src="../lib/common/dom.js"></script>
<script src="../lib/common/random.js"></script>
<script src="../lib/common/angle.js"></script>
<script src="../lib/3d/shapes.js"></script>
<script src="../lib/3d/sky.js"></script>
<script src="../lib/3d/particles.js"></script>
<script src="../lib/audio/synth.js"></script>
<script src="../lib/3d/view.js"></script>
<script src="../lib/3d/weather.js"></script>
<script src="../lib/3d/smoke.js"></script>
<script src="../lib/audio/ambience.js"></script>
<script src="../lib/ui/controls.js"></script>
<script src="../lib/audio/horns.js"></script>
<script src="../lib/audio/engine.js"></script>
<script src="../lib/audio/diesel.js"></script>
<script>
'use strict';
const FOV = 35, VIEW_DIR = new THREE.Vector3(1, .55, 1.25).normalize(), SPIN = .5, FRAME_MS = 6000;
const renderer = new THREE.WebGLRenderer({ canvas: gl, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setScissorTest(true);
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(FOV, 1, .01, 1000);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a66, .75));
const sun = new THREE.DirectionalLight(0xffffff, .85); sun.position.set(3, 6, 4); scene.add(sun);

/* --- Modele budowane w ukrytej ramce z grą (jej silnik i materiały), przenoszone jako JSON --- */
// Wynik modelu → Object3D w świecie ramki
function toObject(r, W) {
  if (Array.isArray(r)) { const g = new W.THREE.Group(); r.forEach(x => g.add(toObject(x, W))); return g; }
  if (r?.isObject3D) return r;
  if (r?.isBufferGeometry) return new W.THREE.Mesh(r, new W.THREE.MeshStandardMaterial({ vertexColors: !!r.attributes.color, roughness: .7, side: W.THREE.DoubleSide }));
  const inner = r && (r.root || r.g || r.mesh || r.obj);
  if (inner) return toObject(inner, W);
  throw new Error('nieznany wynik: ' + Object.keys(r || {}).join(','));
}
// Załaduj grę w ramce, zbuduj jej modele, ramkę usuń
function fromGame(gra, items) {
  return new Promise(done => {
    const f = Object.assign(document.createElement('iframe'), { src: `../${gra}/`, style: 'position:fixed;left:-2000px;top:0;width:640px;height:400px;border:0' });
    f.onload = () => setTimeout(() => {
      for (const m of items) {
        // toJSON saves .matrix (game syncs it only at render); unused vehicles are hidden in game
        try { const o = toObject(f.contentWindow.eval(m.js), f.contentWindow); o.visible = true; o.updateMatrixWorld(true);
          // parametric geometries (SphereGeometry…) serialize only params, losing edited vertices/colors
          o.traverse(x => { if (x.geometry?.parameters) x.geometry = new f.contentWindow.THREE.BufferGeometry().copy(x.geometry); });
          m.json = o.toJSON(); }
        catch (e) { m.err = e.message; }
      }
      f.remove(); done();
    }, 300);
    document.body.append(f);
  });
}
const loader = new THREE.ObjectLoader();
const parse = json => new Promise(ok => loader.parse(json, ok));

// Rozmiar, liczba trójkątów; obiekt wyśrodkowany na podłodze
function prep(obj) {
  // Vehicle headlamps etc. would overexpose the shared gallery lighting
  const lights = []; obj.traverse(o => o.isLight && lights.push(o)); lights.forEach(l => l.parent.remove(l));
  const box = new THREE.Box3().setFromObject(obj), c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  const pivot = new THREE.Group(); obj.position.sub(new THREE.Vector3(c.x, box.min.y, c.z)); pivot.add(obj);
  let tris = 0;
  obj.traverse(o => { if (o.isMesh) { const g = o.geometry, n = (g.index ? g.index.count : g.attributes.position.count) / 3; tris += n * (o.count || 1); } });
  return { pivot, size: s, r: s.length() / 2 || 1, tris: Math.round(tris) };
}

/* --- Lista: sekcje po typie, warianty obok siebie --- */
const nazwa = m => `${m.typ} — ${m.gra}`;
const plik = m => m.plik ?? KAT_PLIK[m.kat];
let kat = decodeURIComponent(location.hash.slice(1)) || KATEGORIE[0];
KATEGORIE.push('dźwięki');
tabs.innerHTML = KATEGORIE.map(k => `<button data-k="${k}">${k}</button>`).join('');
tabs.onclick = e => { if (e.target.dataset.k) { kat = e.target.dataset.k; location.hash = kat; show(); } };
function show() {
  [...tabs.children].forEach(b => b.classList.toggle('on', b.dataset.k === kat));
  gl.hidden = kat === 'dźwięki';                   // płótno modeli nie zasłania dźwięków
  if (kat === 'dźwięki') return showSounds();
  const typy = [...new Set(MODELE.filter(m => m.kat === kat).map(m => m.typ))];
  list.innerHTML = typy.map(t => `<section><h3>${t}</h3><div class="row">${MODELE.map((m, i) => m.kat === kat && m.typ === t
    ? `<div class="card${m.err ? ' err' : ''}" data-i="${i}"><div class="v">${m.err ? '⚠ ' + m.err : ''}</div><p>${m.gra}<small>${m.view ? info(m) : m.err ? '' : 'ładuję…'}</small></p></div>` : '').join('')}</div></section>`).join('');
}
const info = m => `${m.view.size.x.toFixed(1)}×${m.view.size.y.toFixed(1)}×${m.view.size.z.toFixed(1)} m · ${m.view.tris} trójk. · ${m.js}`;
list.onclick = e => { const c = e.target.closest('.card'); if (c && MODELE[c.dataset.i].view) open(MODELE[c.dataset.i]); };

/* --- Dźwięki: klaksony (lib/audio/horns.js), silnik z biegami (lib/audio/engine.js), diesel (lib/audio/diesel.js). Trzymaj przycisk. --- */
const DZW = [
  ['🚕', 'taxi', 'taksówka', 27, 10], ['🚓', 'police', 'radiowóz', 30, 11], ['🏎️', 'race', 'wyścigówka', 40, 15], ['🚌', 'bus', 'autobus', 20, 6.5], ['🚜', 'ursus', 'Ursus', 14, 7, 'diesel'], ['🛩️', 'plane', 'samolot', 34, 9],
  ['🌾', 'combine', 'kombajn (Żniwa)', 7, 3, 'diesel'], ['🚜', 'big', 'duży traktor (Żniwa)', 8, 3, 'diesel'],
  ['🚂', 'steam', 'parowóz (gwizdek)'], ['🚆', 'eu', 'EU07'], ['🚄', 'pend', 'Pendolino']];
const SND = { EN: null, D: {}, kind: '', v: 0, vmax: 1, acc: 1, gas: false, siren: false, horn: null, iv: 0, drpm: 0 };
const DSL_OF = { ursus: 'tractor', combine: 'combine', big: 'big' };       // nazwy profili diesla
function showSounds() {
  list.innerHTML = '<section><h3>klaksony i silniki</h3><div class="row">' + DZW.map(([e, k, n, vmax, , dsl], i) => `<div class="snd" data-i="${i}"><div class="e">${e}</div><p>${n}<small>${vmax ? `hornStart('${k}') · ${dsl ? `dieselSet(dieselProfile('${DSL_OF[k]}'))` : `engineStep({ kind: '${k}' })`}` : `trainHornStart('${k}')`}<br>lib/audio/horns.js${vmax ? (dsl ? ' · lib/audio/diesel.js' : ' · lib/audio/engine.js') : ''}</small></p>
    <div class="b">${k === 'combine' || k === 'big' ? '' : '<button data-a="horn">📯 klakson</button>'}${vmax ? '<button data-a="gas">▲ gaz</button>' + (k === 'police' ? '<button data-a="siren">🚨</button>' : '') : ''}</div>${vmax ? '<meter min="0" max="1" value="0"></meter>' : ''}</div>`).join('') + '</div></section>';
  st.textContent = 'trzymaj przycisk; gaz rozpędza auto przez biegi, puszczony zwalnia';
}
function sndTick() {                               // prosty rozpęd jak w Taxi: gaz przyspiesza, bez gazu zwalnia; silnik cichnie po zatrzymaniu
  const dt = 1/60; SND.v = SND.gas ? Math.min(SND.vmax, SND.v + SND.acc*(1 - .6*SND.v/SND.vmax)*dt) : Math.max(0, SND.v - (3 + SND.v*.3)*dt);
  const dn = DSL_OF[SND.kind]; let rpm;
  if (dn) { const D = SND.D[dn] || (SND.D[dn] = dieselCreate(dieselProfile(dn))); SND.drpm += (.12 + .88*Math.max(SND.gas ? 1 : 0, SND.v/SND.vmax) - SND.drpm)*Math.min(1, dt*4); dieselSet(D, SND.drpm, true); rpm = SND.drpm; engineMute(SND.EN); }
  else { engineStep(SND.EN, dt, { kind: SND.kind, fr: SND.v/SND.vmax, vf: SND.v, thr: SND.gas, siren: SND.siren }); rpm = SND.EN.rpm; }
  Object.keys(SND.D).forEach(k => { if (k !== dn) dieselSet(SND.D[k], 0, false); });
  const m = list.querySelector(`.snd[data-k="${SND.kind}"] meter`); if (m) m.value = rpm;
  if (!SND.gas && !SND.siren && SND.v === 0 && rpm < .14) { engineMute(SND.EN); Object.values(SND.D).forEach(D => dieselSet(D, 0, false)); SND.drpm = 0; clearInterval(SND.iv); SND.iv = 0; }
}
list.addEventListener('pointerdown', e => {
  const b = e.target.closest('.snd button'); if (!b) return; e.preventDefault(); b.setPointerCapture(e.pointerId); initAudio();
  const c = b.closest('.snd'), [, k, , vmax, acc] = DZW[c.dataset.i], a = b.dataset.a; c.dataset.k = k; b.classList.add('on');
  if (a === 'horn') { hornStop(SND.horn); SND.horn = vmax ? hornStart(k) : trainHornStart(k); return; }
  if (!SND.EN) SND.EN = engineCreate(); if (SND.kind !== k) { SND.kind = k; SND.v = 0; SND.siren = false; } SND.vmax = vmax; SND.acc = acc;
  if (a === 'gas') SND.gas = true; else { SND.siren = !SND.siren; b.classList.toggle('on', SND.siren); }
  if (!SND.iv) SND.iv = setInterval(sndTick, 1000/60);
});
['pointerup', 'pointercancel'].forEach(t => list.addEventListener(t, e => {
  const b = e.target.closest('.snd button'); if (!b) return; if (b.dataset.a !== 'siren') b.classList.remove('on');
  if (b.dataset.a === 'horn') { hornStop(SND.horn, b.closest('.snd').dataset.k === 'steam' ? .5 : .26); SND.horn = null; } else if (b.dataset.a === 'gas') SND.gas = false;
}));

/* --- Podgląd: obracanie palcem/myszą, zoom kółkiem/szczypaniem --- */
let big = null; const orbit = { yaw: 0, pitch: .45, zoom: 1 };
function open(m) { big = m; Object.assign(orbit, { yaw: 0, pitch: .45, zoom: 1 }); bigHidden(false); document.getElementById('info').innerHTML = `${nazwa(m)}<small>${plik(m)} · ${info(m)}</small>`; }
const bigHidden = h => { document.getElementById('big').hidden = h; if (h) big = null; };
x.onclick = () => bigHidden(true);
addEventListener('keydown', e => e.key === 'Escape' && bigHidden(true));
const pts = new Map();
bigV.onpointerdown = e => { bigV.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); };
bigV.onpointerup = bigV.onpointercancel = e => pts.delete(e.pointerId);
bigV.onpointermove = e => {
  const p = pts.get(e.pointerId); if (!p) return;
  if (pts.size === 1) { orbit.yaw -= (e.clientX - p[0]) * .01; orbit.pitch = Math.max(-.2, Math.min(1.4, orbit.pitch + (e.clientY - p[1]) * .01)); }
  else { const [a, b] = [...pts.values()], d0 = Math.hypot(a[0] - b[0], a[1] - b[1]); p[0] = e.clientX; p[1] = e.clientY; const [c, d] = [...pts.values()]; orbit.zoom *= d0 / Math.hypot(c[0] - d[0], c[1] - d[1]); }
  p[0] = e.clientX; p[1] = e.clientY;
};
bigV.onwheel = e => { e.preventDefault(); orbit.zoom *= Math.exp(e.deltaY * .001); };

/* --- Rysowanie: jedno płótno, każda karta to wycinek (scissor) --- */
function draw(m, el, t, dir, zoom = 1) {
  const r = el.getBoundingClientRect();
  if (r.bottom < 0 || r.top > innerHeight || r.width === 0) return;
  const y = innerHeight - r.bottom;
  renderer.setViewport(r.left, y, r.width, r.height); renderer.setScissor(r.left, y, r.width, r.height);
  cam.aspect = r.width / r.height;
  const v = m.view, dist = v.r / Math.sin(THREE.MathUtils.degToRad(FOV / 2)) * zoom * (cam.aspect < 1 ? 1 / cam.aspect : 1);
  cam.position.copy(dir).multiplyScalar(dist).add(new THREE.Vector3(0, v.size.y / 2, 0));
  cam.lookAt(0, v.size.y / 2, 0); cam.near = dist / 100; cam.far = dist * 10; cam.updateProjectionMatrix();
  v.pivot.rotation.y = t;
  scene.add(v.pivot); renderer.render(scene, cam); scene.remove(v.pivot);
}
function frame(ms) {
  requestAnimationFrame(frame);
  const w = innerWidth, h = innerHeight;
  if (gl.width !== Math.round(w * renderer.getPixelRatio()) || gl.height !== Math.round(h * renderer.getPixelRatio())) renderer.setSize(w, h, false);
  renderer.setScissor(0, 0, w, h); renderer.clear();
  if (big) {
    const d = new THREE.Vector3(Math.sin(orbit.yaw) * Math.cos(orbit.pitch), Math.sin(orbit.pitch), Math.cos(orbit.yaw) * Math.cos(orbit.pitch));
    return draw(big, bigV, 0, d, orbit.zoom * .8);
  }
  if (kat === 'dźwięki') return;
  for (const el of list.querySelectorAll('.card')) { const m = MODELE[el.dataset.i]; if (m.view) draw(m, el.firstChild, ms / 1000 * SPIN, VIEW_DIR); }
}

/* --- Start: gry po kolei, wybrana kategoria najpierw --- */
(async () => {
  show(); requestAnimationFrame(frame);
  const gry = [...new Set([...MODELE.filter(m => m.kat === kat), ...MODELE].map(m => m.gra))];
  for (const [i, gra] of gry.entries()) {
    if (kat !== 'dźwięki') st.textContent = `ładuję ${gra} (${i + 1}/${gry.length})…`;
    const items = MODELE.filter(m => m.gra === gra);
    await fromGame(gra, items);
    for (const m of items) if (m.json) { try { m.view = prep(await parse(m.json)); } catch (e) { m.err = e.message; } delete m.json; }
    if (kat !== 'dźwięki') show();
  }
  const bad = MODELE.filter(m => m.err).length;
  if (kat !== 'dźwięki') st.textContent = `${MODELE.length - bad} modeli` + (bad ? `, ${bad} z błędem` : '');
})();
</script>
</body>
</html>
