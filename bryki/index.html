<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dzikie Bryki</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦈</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap">
<style>
:root{--panel:#fff3d6;--ink:#3a2412;--edge:#1e120a;--gold:#ffc93c;--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none !important}
html,body{height:100%;margin:0;overflow:hidden;background:#f3c27a;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:"Baloo 2",ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;color:var(--ink);touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;color:var(--ink);font-weight:800}
#cars{position:absolute;left:0;right:0;bottom:calc(8px + var(--sb));display:flex;justify-content:center;gap:clamp(8px,2vw,22px);padding:0 calc(10px + var(--sr)) 0 calc(10px + var(--sl))}
.car{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(255,243,214,.85);border-radius:18px;box-shadow:0 4px 0 var(--edge);padding:5px 7px}
.car .ic{font-size:30px;line-height:1}
.car .b{display:flex;gap:6px}
.car button{width:48px;height:42px;border-radius:12px;background:var(--panel);box-shadow:0 3px 0 var(--edge);font-size:22px;padding:0}
.car button:active{transform:translateY(3px);box-shadow:0 0 0 var(--edge)}
.car button.cd{opacity:.45}
#menu{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(255,243,214,.15),rgba(30,18,10,.55))}
#menu .box{text-align:center;color:#fff;-webkit-text-stroke:2px var(--edge);paint-order:stroke fill;font-weight:800}
#menu h1{margin:0;font-size:clamp(34px,8vw,72px);line-height:1}
#menu p{margin:4px 0 14px;font-size:clamp(28px,5vw,44px);letter-spacing:6px}
#bGo{font-size:56px;width:130px;height:110px;border-radius:30px;background:var(--gold);box-shadow:0 7px 0 var(--edge);-webkit-text-stroke:0}
#bGo:active{transform:translateY(5px);box-shadow:0 2px 0 var(--edge)}
#tag{position:absolute;left:calc(10px + var(--sl));top:calc(8px + var(--st));background:rgba(255,243,214,.85);border-radius:999px;padding:2px 12px;box-shadow:0 3px 0 var(--edge);font-size:15px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui" hidden>
  <div id="tag">mockup · 💥 atak · ⭐ moc</div>
  <div id="cars"></div>
</div>
<div id="menu"><div class="box"><h1>Dzikie Bryki</h1><p>🦈 🐦 🐙 🦀</p><button id="bGo">🏁</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../models/pojazdy.bryki.js"></script>
<script src="game.js"></script>
</body>
</html>
