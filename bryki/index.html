<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#3a2412">
<title>Dzikie Bryki</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦈</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Bangers&display=swap">
<style>
:root{--panel:#fff3d6;--ink:#3a2412;--edge:#1e120a;--gold:#ffc93c;--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none !important}
html,body{height:100%;margin:0;overflow:hidden;background:#f3c27a;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:"Baloo 2",ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;color:var(--ink);touch-action:none;pointer-events:auto;padding:0;position:relative;overflow:hidden}
.ov{position:fixed;inset:0;pointer-events:none;font-weight:800}
.rb{width:42px;height:42px;border-radius:50%;background:var(--panel);box-shadow:0 3px 0 var(--edge);font-size:20px;display:grid;place-items:center}
/* --- gra --- */
#top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:calc(6px + var(--st)) calc(10px + var(--sr)) 0 calc(10px + var(--sl))}
#place{font-size:38px;line-height:1;filter:drop-shadow(0 2px 0 var(--edge));min-width:46px;text-align:center;transition:transform .2s}
#place.pop{transform:scale(1.35)}
#prog{flex:1;max-width:560px;margin:0 auto;height:14px;border-radius:99px;background:rgba(30,18,10,.45);position:relative;border:2px solid rgba(255,255,255,.7)}
#prog i{position:absolute;right:-14px;top:50%;transform:translateY(-55%);font-style:normal;font-size:26px}
#prog span img{height:28px;display:block}#prog span.me img{height:38px}
#prog span{position:absolute;top:50%;font-size:22px;transform:translate(-50%,-55%);transition:left .1s linear;filter:drop-shadow(0 1px 0 #000)}
#prog span.me{font-size:30px;z-index:2;filter:drop-shadow(0 0 4px #fff) drop-shadow(0 1px 0 #000)}
.side{position:absolute;bottom:calc(10px + var(--sb));display:flex;flex-direction:column;gap:10px;align-items:center}
#left{left:calc(8px + var(--sl));top:calc(58px + var(--st));gap:12px}
#left .gb{width:112px;flex:1;max-height:190px;font-size:56px;border-radius:28px;background:rgba(255,243,214,.5)}#right{right:calc(10px + var(--sr))}
.gb{width:80px;height:80px;border-radius:24px;background:rgba(255,243,214,.8);box-shadow:0 5px 0 var(--edge);font-size:38px;display:grid;place-items:center}
#bAtak.hot{background:#ff3a2a;animation:pulse .25s infinite alternate}
.gb.dn,.gb:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.gb .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(30,18,10,.5);pointer-events:none}
#bAtak{width:98px;height:98px;border-radius:50%;font-size:48px;background:rgba(255,120,90,.85)}
#bTurbo{width:70px;height:70px;font-size:32px;background:rgba(140,220,255,.85)}
#bTurbo.act{background:#ff9a1a;animation:pulse .18s infinite alternate;box-shadow:0 0 22px 6px #ffd23f,0 5px 0 var(--edge)}
#bMoc{background:rgba(255,243,214,.8)}
#bMoc .pips{position:absolute;bottom:3px;left:0;right:0;display:flex;justify-content:center;gap:4px}
#bMoc .pips b{width:14px;height:14px;border-radius:50%;background:rgba(30,18,10,.3);border:2px solid rgba(30,18,10,.5)}
#bMoc .pips b.on{background:var(--gold);border-color:#b8860b}
#bMoc.full{background:var(--gold);animation:pulse .35s infinite alternate}
#bMoc span.i{margin-top:-14px}
@keyframes pulse{to{transform:scale(1.1);box-shadow:0 0 18px 4px #fff36a,0 5px 0 var(--edge)}}
.edge{position:absolute;font-size:30px;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 0 var(--edge));display:flex;align-items:center;gap:0}
.edge img{height:40px;display:block}.edge b{font-size:20px;color:#fff;-webkit-text-stroke:1px var(--edge)}
.bub{position:absolute;transform:translate(-50%,-50%);animation:bub 1s cubic-bezier(.2,1.6,.4,1) forwards;pointer-events:none;--c:#ffd23f}
.bub i{position:absolute;inset:-26px -34px;background:#111;clip-path:polygon(104% 50%,83% 59%,92% 74%,72% 73%,72% 94%,55% 80%,43% 95%,36% 78%,15% 87%,21% 67%,2% 63%,16% 50%,-2% 36%,21% 33%,17% 16%,36% 22%,42% 2%,55% 20%,71% 9%,72% 27%,95% 24%,83% 41%)}
.bub i::after{content:"";position:absolute;inset:6px;background:var(--c);clip-path:inherit}
.bub b{position:relative;display:block;font:400 38px/1 Bangers,"Baloo 2",Impact,sans-serif;letter-spacing:2px;color:#fff;-webkit-text-stroke:3px #111;paint-order:stroke fill;white-space:nowrap;text-shadow:3px 3px 0 #111}
.bub.big b{font-size:48px}.bub.small b{font-size:26px}.bub.small i{inset:-14px -20px}
.bub.emoji i{display:none}.bub.pic img{width:110px;display:block;filter:drop-shadow(0 3px 0 #111) drop-shadow(0 0 6px #fff)}.bub.emoji b{font-size:44px;-webkit-text-stroke:0;text-shadow:none}
@keyframes bub{0%{transform:translate(-50%,-30%) scale(.2) rotate(var(--r,-10deg));opacity:0}18%{transform:translate(-50%,-60%) scale(1.15) rotate(var(--r,-10deg));opacity:1}75%{transform:translate(-50%,-75%) scale(1) rotate(var(--r,-10deg));opacity:1}100%{transform:translate(-50%,-110%) scale(.9) rotate(var(--r,-10deg));opacity:0}}
#splat{position:absolute;inset:0;overflow:hidden}
#splat i{position:absolute;border-radius:50%;transform:translate(-50%,-50%);animation:splat 2s ease-in forwards}
@keyframes splat{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}8%{opacity:.95;transform:translate(-50%,-50%) scale(1.1)}70%{opacity:.85}100%{opacity:0;transform:translate(-50%,-30%) scale(1)}}
#count{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:110px;line-height:1;filter:drop-shadow(0 6px 0 var(--edge))}
#count.go{animation:go .7s ease-out forwards}
@keyframes go{to{transform:translate(-50%,-50%) scale(2.2);opacity:0}}
/* --- menu, pauza, wyniki: tabliczki jak w Żniwach --- */
:root{--plate:#fff4d6;--plate-edge:#c9a35a;--red:#d9432a;--red-edge:#9c2a18;--wheat:#f2b632;--shade:rgba(60,35,10,.28);--card:rgba(255,246,222,.95)}
.btn{font:800 1.05rem/1 "Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:var(--plate);border-radius:18px;
  display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 5px 0 var(--plate-edge),0 9px 14px var(--shade);transition:transform .06s,box-shadow .06s;overflow:visible}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--plate-edge),0 3px 6px var(--shade)}
.btn .ico{font-size:1.65rem;line-height:1}
.btn.on{background:var(--wheat);color:#3b2a17;box-shadow:0 5px 0 #b07a12,0 9px 14px var(--shade)}
.btn .med{position:absolute;right:-6px;top:-8px;font-size:1.15rem}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:flex-end;overflow:hidden !important;padding:calc(10px + var(--st)) calc(14px + var(--sr)) calc(10px + var(--sb)) 12px;
  background:linear-gradient(90deg,rgba(0,0,0,0) 30%,rgba(242,182,50,.25));overflow:auto}
.card{transform-origin:right center;background:var(--card);border-radius:28px;padding:10px 16px 14px;width:min(600px,100%);box-shadow:0 7px 0 var(--plate-edge),0 18px 40px var(--shade);text-align:center}
.card h1{display:inline;font-size:2.1rem;line-height:1;margin:0;font-weight:800;color:var(--red);text-shadow:0 3px 0 var(--plate-edge)}
.card .sub{display:inline;margin-left:10px;font-size:1rem;font-weight:700}
.q{font-size:.95rem;font-weight:700;margin:8px 0 5px;text-align:left}
.grid{display:grid;gap:8px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}.g1{grid-template-columns:1fr}
.duo{display:grid;grid-template-columns:2fr 1fr;gap:0 14px}
.pick{height:46px;position:relative}
.pick.car{height:52px;justify-content:flex-start;padding-left:4px;gap:4px}.pick.car img{height:46px;margin:-6px 0}
#bGo{width:100%;height:56px;margin-top:12px;font-size:1.6rem;background:var(--red);color:#fff;box-shadow:0 6px 0 var(--red-edge),0 10px 16px var(--shade)}
#bGo:active{box-shadow:0 2px 0 var(--red-edge)}
#bSnd{position:fixed;left:calc(12px + var(--sl));top:calc(10px + var(--st));width:56px;height:48px;font-size:1.4rem}
@media (min-height:520px){.pick{height:56px}#bGo{height:66px}.card{padding:16px 20px 20px}}
.box{position:fixed;inset:0;display:grid;place-items:center;background:rgba(30,18,10,.45);pointer-events:auto}
.box .in{display:flex;flex-direction:column;align-items:center;gap:16px}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.box .btn{height:62px;padding:0 20px;font-size:1.25rem}
.box .btn.go{background:var(--red);color:#fff;box-shadow:0 6px 0 var(--red-edge),0 10px 16px var(--shade)}
#podium{display:flex;align-items:flex-end;gap:10px}
#podium div{display:flex;flex-direction:column;align-items:center;background:var(--plate);border-radius:18px 18px 8px 8px;box-shadow:0 5px 0 var(--plate-edge);width:88px;padding:6px 0 4px;font-size:40px;line-height:1.05}
#podium div b{font-size:34px}#podium div img{width:84px;margin:-6px 0 0}
#podium div.me{background:var(--wheat);animation:pulse .4s infinite alternate}
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#confetti i{position:absolute;top:-40px;font-style:normal;font-size:28px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="ov" hidden>
  <div id="top"><div id="place">🥇</div><div id="prog"><i>🏁</i></div><button id="bPause" class="rb">⏸</button></div>
  <div id="edges"></div>
  <div id="fx"></div>
  <div id="splat"></div>
  <div id="count" hidden></div>
  <div id="left" class="side"><button id="bUp" class="gb">⬆️</button><button id="bDn" class="gb">⬇️</button></div>
  <div id="right" class="side"><button id="bTurbo" class="gb">🚀<i class="cd"></i></button><button id="bMoc" class="gb"><span class="i">⭐</span><span class="pips"><b></b><b></b><b></b></span></button><button id="bAtak" class="gb">💥<i class="cd"></i></button></div>
</div>
<div id="menu">
  <div class="card">
    <h1>Dzikie Bryki</h1><p class="sub">Wyścig groźnych bryk</p>
    <p class="q">Którą bryką jedziesz?</p>
    <div class="grid g3" id="pickCar"></div>
    <div class="duo">
      <div><p class="q">Gdzie jedziemy?</p><div class="grid g2" id="pickTrack"></div></div>
      <div><p class="q">Jak trudno?</p><div class="grid g1" id="pickDiff"><button class="btn pick" data-d="latwy"><span class="ico">🐣</span>Łatwo</button><button class="btn pick" data-d="trudny"><span class="ico">🔥</span>Trudno</button></div></div>
    </div>
    <button class="btn" id="bGo">Jedziemy!</button>
  </div>
  <button class="btn" id="bSnd" aria-label="Dźwięk">🔊</button>
</div>
<div id="pause" class="box" hidden><div class="in"><div class="row"><button id="bResume" class="btn go"><span class="ico">▶️</span>Graj dalej</button><button id="bQuit" class="btn"><span class="ico">🏠</span>Menu</button></div></div></div>
<div id="end" class="box" hidden><div class="in"><div id="podium"></div><div class="row"><button id="bAgain" class="btn"><span class="ico">🔁</span>Jeszcze raz</button><button id="bNext" class="btn go"><span class="ico">➡️</span>Następna trasa</button><button id="bHome" class="btn"><span class="ico">🏠</span>Menu</button></div></div></div>
<div id="confetti"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../models/pojazdy.bryki.js"></script>
<script src="../models/trasy.bryki.js"></script>
<script src="dzwieki.js"></script>
<script src="game.js"></script>
<script src="../lib/obrot.ciuchcia-taxi-zniwa-pralnia-arka-rafa-piraci-bryki.js"></script>
<script>obrotInit()</script>
</body>
</html>
